<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Scale</title>
<script src="/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
    --accent: #00d9a0; --accent-dim: #007a5a;
    --warn: #f59e0b; --error: #ef4444;
    --text-1: #f0f0f0; --text-2: #888; --text-3: #555;
  }
  body {
    background: var(--bg); color: var(--text-1);
    font-family: "SF Mono", "Consolas", monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px; padding: 24px;
  }
  .title { font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-3); }
  .scale-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 64px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-width: 340px; transition: border-color 0.3s ease;
  }
  .scale-card.stable   { border-color: var(--accent-dim); }
  .scale-card.unstable { border-color: #3a3a2a; }
  .scale-card.error    { border-color: #3a1a1a; }
  .weight-display { display: flex; align-items: baseline; gap: 12px; }
  .weight-value {
    font-size: 80px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1; color: var(--accent); transition: color 0.4s ease; letter-spacing: -2px;
  }
  .weight-value.unstable { color: var(--warn); }
  .weight-value.error    { color: var(--error); }
  .weight-unit { font-size: 28px; color: var(--text-2); font-weight: 400; }
  .weight-grams { font-size: 20px; color: var(--text-2); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .stability-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .stability-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); transition: background 0.3s; }
  .stability-dot.stable   { background: var(--accent); }
  .stability-dot.unstable { background: var(--warn); }
  .stability-dot.error    { background: var(--error); }
  .stability-label { font-size: 12px; color: var(--text-2); letter-spacing: 0.1em; text-transform: uppercase; }
  .btn-tare {
    background: transparent; border: 1px solid var(--border); border-radius: 10px;
    color: var(--text-2); font-family: inherit; font-size: 13px;
    letter-spacing: 0.15em; text-transform: uppercase; padding: 12px 36px;
    cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .btn-tare:hover { border-color: var(--accent-dim); color: var(--accent); background: rgba(0,217,160,0.05); }
  .tare-feedback { font-size: 12px; color: var(--text-3); min-height: 18px; text-align: center; transition: opacity 0.4s; }
  .conn-row { display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--error); transition: background 0.3s; }
  .conn-dot.connected { background: var(--accent); }
  .conn-label { font-size: 11px; color: var(--text-3); letter-spacing: 0.1em; }
  .max-row { font-size: 12px; color: var(--text-3); letter-spacing: 0.1em; }
  @keyframes pulse-warn { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .weight-value.settling { animation: pulse-warn 0.8s ease-in-out infinite; }
</style>
</head>
<body>
  <span class="title">Digital Scale - AQ3</span>
  <div class="scale-card" id="scale-card">
    <div class="weight-display">
      <span class="weight-value" id="weight-kg">- - -</span>
      <span class="weight-unit">kg</span>
    </div>
    <div class="weight-grams" id="weight-g">-- g</div>
    <div class="stability-row">
      <div class="stability-dot" id="stability-dot"></div>
      <span class="stability-label" id="stability-label">waiting</span>
    </div>
  </div>
  <button class="btn-tare" id="btn-tare" onclick="doTare()">Tare / Zero</button>
  <div class="tare-feedback" id="tare-feedback"></div>
  <div class="max-row">Max: 20 kg</div>
  <div class="conn-row">
    <div class="conn-dot" id="conn-dot"></div>
    <span class="conn-label" id="conn-label">connecting</span>
  </div>
<script>
  const elKg        = document.getElementById("weight-kg");
  const elG         = document.getElementById("weight-g");
  const elCard      = document.getElementById("scale-card");
  const elDot       = document.getElementById("stability-dot");
  const elLabel     = document.getElementById("stability-label");
  const elConn      = document.getElementById("conn-dot");
  const elConnLabel = document.getElementById("conn-label");
  const elFeedback  = document.getElementById("tare-feedback");
  const elTareBtn   = document.getElementById("btn-tare");

  const socket = io("http://" + window.location.host);

  socket.on("connect", () => {
    elConn.classList.add("connected");
    elConnLabel.textContent = "live";
  });
  socket.on("disconnect", () => {
    elConn.classList.remove("connected");
    elConnLabel.textContent = "disconnected";
    setError();
  });
  socket.on("weight_update", (data) => {
    if (!data.sensor_ok) { setError(); return; }
    elKg.textContent = data.weight_kg.toFixed(3);
    elG.textContent  = Math.round(data.weight_g) + " g";
    if (data.stable) {
      elKg.className  = "weight-value stable";
      elDot.className = "stability-dot stable";
      elLabel.textContent = "stable";
      elCard.className = "scale-card stable";
    } else {
      elKg.className  = "weight-value unstable settling";
      elDot.className = "stability-dot unstable";
      elLabel.textContent = "settling";
      elCard.className = "scale-card unstable";
    }
  });
  socket.on("tare_result", (data) => {
    elTareBtn.disabled = false;
    showFeedback(data.ok ? "Tare set - scale zeroed" : "Tare failed");
  });
  function setError() {
    elKg.textContent = "- - -";
    elG.textContent  = "sensor error";
    elKg.className   = "weight-value error";
    elDot.className  = "stability-dot error";
    elLabel.textContent = "no sensor";
    elCard.className = "scale-card error";
  }
  function doTare() {
    elTareBtn.disabled = true;
    showFeedback("Zeroing...");
    socket.emit("do_tare", {});
  }
  let _ft = null;
  function showFeedback(msg) {
    elFeedback.textContent = msg;
    elFeedback.style.opacity = "1";
    clearTimeout(_ft);
    _ft = setTimeout(() => { elFeedback.style.opacity = "0"; }, 3000);
  }
</script>
</body>
</html>
