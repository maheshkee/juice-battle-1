<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Whistle Counter</title>
<script src="/libs/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:      #0a0a0f;
    --surface: #13131a;
    --border:  #1e1e2e;
    --accent:  #ff4d00;
    --accent2: #ff9500;
    --green:   #00ff88;
    --red:     #ff2d55;
    --text:    #e8e8f0;
    --muted:   #555566;
    --glow:    0 0 30px rgba(255,77,0,0.4);
    --glow2:   0 0 20px rgba(0,255,136,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(255,77,0,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(255,149,0,0.04) 0%, transparent 60%);
  }

  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .status-dot.online {
    background: var(--green);
    box-shadow: var(--glow2);
    animation: pulse-green 2s infinite;
  }

  @keyframes pulse-green {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* count card */
  .count-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .count-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .count-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .count-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 110px;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform 0.2s;
    filter: drop-shadow(0 0 20px rgba(255,77,0,0.5));
  }

  .count-number.bump { transform: scale(1.15); }

  .count-time {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* listening bar */
  .listening-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
  }

  .wave-bars {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
  }

  .wave-bar {
    width: 4px;
    border-radius: 2px;
    background: var(--accent);
    height: 6px;
  }

  .listening .wave-bar:nth-child(1) { animation: wave 1s ease-in-out infinite 0s; }
  .listening .wave-bar:nth-child(2) { animation: wave 1s ease-in-out infinite 0.15s; }
  .listening .wave-bar:nth-child(3) { animation: wave 1s ease-in-out infinite 0.3s; }
  .listening .wave-bar:nth-child(4) { animation: wave 1s ease-in-out infinite 0.45s; }
  .listening .wave-bar:nth-child(5) { animation: wave 1s ease-in-out infinite 0.6s; }

  @keyframes wave {
    0%, 100% { height: 6px; }
    50%       { height: 22px; }
  }

  /* buttons */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-start {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    box-shadow: var(--glow);
  }

  .btn-start:hover { box-shadow: 0 0 40px rgba(255,77,0,0.6); }

  .btn-stop {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-stop:hover { border-color: var(--red); color: var(--red); }

  .btn-reset {
    grid-column: 1 / -1;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 13px;
    padding: 11px;
  }

  .btn-reset:hover { color: var(--text); border-color: var(--muted); }

  /* two column feeds */
  .feeds {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 500px) {
    .feeds { grid-template-columns: 1fr; }
  }

  .feed-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .feed-header {
    padding: 10px 14px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .feed-body {
    padding: 10px;
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .feed-entry {
    display: flex;
    gap: 8px;
    font-size: 11px;
    padding: 5px 7px;
    border-radius: 6px;
    animation: fadein 0.2s ease;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .feed-entry.whistle {
    background: rgba(255,77,0,0.12);
    border-left: 2px solid var(--accent);
    color: var(--accent2);
    font-weight: 500;
  }

  .feed-entry.pulse {
    background: rgba(255,149,0,0.06);
    border-left: 2px solid var(--accent2);
    color: #cc8800;
  }

  .feed-entry.cooldown {
    background: rgba(255,45,85,0.06);
    border-left: 2px solid var(--red);
    color: var(--red);
    opacity: 0.7;
  }

  .feed-entry.default { color: var(--muted); }

  .feed-time {
    color: var(--muted);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* consecutive bar */
  .consec-bar-wrap {
    padding: 0 14px 10px;
  }

  .consec-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }

  .consec-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.2s;
  }

  .consec-label {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }

  /* flash */
  .whistle-flash {
    position: fixed;
    inset: 0;
    background: rgba(255,77,0,0.12);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 999;
  }

  .whistle-flash.active { opacity: 1; }
</style>
</head>
<body>

<div class="whistle-flash" id="flash"></div>

<header>
  <div class="logo">🍲 Whistle Counter</div>
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting</span>
  </div>
</header>

<div class="main">

  <div class="count-card">
    <div class="count-label">Whistles Detected</div>
    <div class="count-number" id="countNumber">0</div>
    <div class="count-time" id="countTime">--</div>
  </div>

  <div class="listening-bar">
    <div class="wave-bars" id="waveBars">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <span id="listeningText">Idle</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-start" onclick="sendStart()">▶ Start</button>
    <button class="btn btn-stop"  onclick="sendStop()">⏹ Stop</button>
    <button class="btn btn-reset" onclick="sendReset()">↺ Reset</button>
  </div>

  <div class="feeds">

    <!-- Detection Feed -->
    <div class="feed-card">
      <div class="feed-header">
        <span>Detection Feed</span>
        <span id="pulseCount">0</span>
      </div>
      <div class="consec-bar-wrap">
        <div class="consec-bar-bg">
          <div class="consec-bar-fill" id="consecBar"></div>
        </div>
        <div class="consec-label">
          <span>Consecutive</span>
          <span id="consecText">0 / 5</span>
        </div>
      </div>
      <div class="feed-body" id="pulseFeed"></div>
    </div>

    <!-- Activity Log -->
    <div class="feed-card">
      <div class="feed-header">
        <span>Activity Log</span>
        <span id="logCount">0</span>
      </div>
      <div class="feed-body" id="logFeed"></div>
    </div>

  </div>

</div>

<script>
const socket = io(`http://${window.location.host}`);
let pulseCount = 0;
let logCount   = 0;
let listening  = false;

socket.on('connect', () => {
  document.getElementById('statusDot').classList.add('online');
  document.getElementById('statusText').textContent = 'Connected';
  addLog('Connected', 'default');
});

socket.on('disconnect', () => {
  document.getElementById('statusDot').classList.remove('online');
  document.getElementById('statusText').textContent = 'Disconnected';
});

socket.on('whistle_count', (data) => {
  const el = document.getElementById('countNumber');
  el.textContent = data.count;
  document.getElementById('countTime').textContent = `Last: ${data.time}`;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 200);
  const flash = document.getElementById('flash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 300);
});

socket.on('detection_pulse', (data) => {
  pulseCount++;
  document.getElementById('pulseCount').textContent = pulseCount;

  // update consecutive bar
  const pct = Math.min(100, (data.consecutive / data.needed) * 100);
  document.getElementById('consecBar').style.width = pct + '%';
  document.getElementById('consecText').textContent = `${data.consecutive} / ${data.needed}`;

  let type = 'pulse';
  let msg  = `Detection ${data.consecutive}/${data.needed}`;

  if (data.cooldown) {
    type = 'cooldown';
    msg  = 'Cooldown active';
  } else if (!data.active) {
    type = 'default';
    msg  = 'Detected (not counting)';
  }

  addPulse(msg, type, data.time);
});

socket.on('log', (data) => {
  const isWhistle = data.message.toLowerCase().includes('confirmed');
  addLog(data.message, isWhistle ? 'whistle' : 'default', data.time);
  if (isWhistle) {
    // reset consecutive bar on confirm
    document.getElementById('consecBar').style.width = '0%';
    document.getElementById('consecText').textContent = '0 / 5';
  }
});

function addPulse(msg, type, time) {
  const body = document.getElementById('pulseFeed');
  const entry = document.createElement('div');
  entry.className = `feed-entry ${type}`;
  entry.innerHTML = `<span class="feed-time">${time || now()}</span><span>${msg}</span>`;
  body.appendChild(entry);
  body.scrollTop = body.scrollHeight;
  if (body.children.length > 60) body.removeChild(body.firstChild);
}

function addLog(msg, type, time) {
  const body = document.getElementById('logFeed');
  const entry = document.createElement('div');
  entry.className = `feed-entry ${type}`;
  entry.innerHTML = `<span class="feed-time">${time || now()}</span><span>${msg}</span>`;
  body.appendChild(entry);
  body.scrollTop = body.scrollHeight;
  logCount++;
  document.getElementById('logCount').textContent = logCount;
  if (body.children.length > 60) body.removeChild(body.firstChild);
}

function now() {
  return new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function setListening(on) {
  listening = on;
  const bars = document.getElementById('waveBars');
  const text = document.getElementById('listeningText');
  if (on) {
    bars.classList.add('listening');
    text.textContent = 'Listening...';
    text.style.color = 'var(--accent)';
  } else {
    bars.classList.remove('listening');
    text.textContent = 'Idle';
    text.style.color = '';
  }
}

function sendStart() { socket.emit('start', {}); setListening(true); }
function sendStop()  { socket.emit('stop',  {}); setListening(false); }
function sendReset() {
  socket.emit('reset', {});
  document.getElementById('countNumber').textContent = '0';
  document.getElementById('countTime').textContent = '--';
  document.getElementById('consecBar').style.width = '0%';
  document.getElementById('consecText').textContent = '0 / 5';
}
</script>
</body>
</html>
