<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HX711 Weight Monitor</title>
</head>
<body style="margin:0; padding:24px; background:#0f0f0f; color:#fff;
             font-family:-apple-system,BlinkMacSystemFont,sans-serif; min-height:100vh;">

  <!-- Current weight -->
  <div style="margin-bottom:32px;">
    <div style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
                color:#444; margin-bottom:8px;">Current Weight</div>
    <div id="weight-display" style="font-size:96px; font-weight:100; line-height:1;
                color:#fff; font-variant-numeric:tabular-nums;">
      --
    </div>
    <div style="font-size:18px; color:#555; margin-top:4px;">grams</div>
  </div>

  <!-- Last change -->
  <div style="margin-bottom:32px; padding:16px; background:#1a1a1a; border-radius:8px;
              max-width:320px;">
    <div style="font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
                color:#444; margin-bottom:8px;">Last Change</div>
    <div id="delta-display" style="font-size:28px; font-weight:300;
                color:#888; font-variant-numeric:tabular-nums;">
      Waiting for readings...
    </div>
  </div>

  <!-- Elapsed time -->
  <div style="margin-bottom:32px; padding:12px 16px; background:#111; border-radius:8px;
              max-width:320px;">
    <div style="font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
                color:#444; margin-bottom:6px;">Time Since Last Event</div>
    <div id="elapsed-display" style="font-size:16px; color:#555; font-family:monospace;">
      —
    </div>
  </div>

  <!-- Event log -->
  <div style="max-width:480px;">
    <div style="font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
                color:#444; margin-bottom:12px;">Event Log</div>
    <div id="event-log" style="font-family:monospace; font-size:13px; color:#555;">
      <div>No events yet.</div>
    </div>
  </div>

<script src="/socket.io.min.js"></script>
<script>
  const MAX_LOG = 10;
  const log = [];

  const weightEl  = document.getElementById("weight-display");
  const deltaEl   = document.getElementById("delta-display");
  const elapsedEl = document.getElementById("elapsed-display");
  const logEl     = document.getElementById("event-log");

  function renderLog() {
    logEl.innerHTML = log.map(e => {
      const sign  = e.delta >= 0 ? "+" : "";
      const color = e.delta >= 0 ? "#00c853" : "#ff5252";
      return `<div style="padding:4px 0; border-bottom:1px solid #1a1a1a;">
        <span style="color:#333;">${e.timestamp}</span>
        &nbsp;&nbsp;
        <span style="color:#888;">${e.weight.toFixed(1)}g</span>
        &nbsp;&nbsp;
        <span style="color:${color};">${sign}${e.delta.toFixed(1)}g</span>
      </div>`;
    }).join("");
  }

  const socket = io(`http://${window.location.host}`);

  socket.on("weight_event", function(data) {
    const weight  = data.weight_g;
    const delta   = data.delta_g;
    const ts      = data.timestamp;
    const elapsed = data.elapsed || "";

    weightEl.textContent = weight.toFixed(1);

    const sign  = delta >= 0 ? "+" : "";
    const color = delta >= 0 ? "#00c853" : "#ff5252";
    const label = delta >= 0 ? "added" : "removed";
    deltaEl.innerHTML =
      `<span style="color:${color};">${sign}${delta.toFixed(1)}g ${label}</span>`;

    elapsedEl.textContent = elapsed;

    log.unshift({ weight, delta, timestamp: ts });
    if (log.length > MAX_LOG) log.pop();
    renderLog();
  });
</script>
</body>
</html>
