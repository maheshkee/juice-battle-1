<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Scale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #weight {
    font-size: 96px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
  }
  #unit {
    font-size: 32px;
    font-weight: 300;
    opacity: 0.6;
    margin-left: 8px;
  }
  #status {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
  }
  #status.stable { color: #4caf50; opacity: 0.9; }
  #status.measuring { color: #ff9800; opacity: 0.7; }
  #raw {
    font-size: 11px;
    color: #444;
    letter-spacing: 1px;
    position: fixed;
    bottom: 20px;
  }
</style>
</head>
<body>
  <div>
    <span id="weight">—</span><span id="unit">g</span>
  </div>
  <div id="status" class="measuring">measuring</div>
  <div id="raw">raw: —</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    const weightEl = document.getElementById('weight');
    const statusEl = document.getElementById('status');
    const rawEl    = document.getElementById('raw');

    socket.on('weight_update', function(data) {
      weightEl.textContent = parseFloat(data.grams).toFixed(3);
      rawEl.textContent    = 'raw: ' + data.raw;
      if (data.stable) {
        statusEl.textContent = 'stable';
        statusEl.className   = 'stable';
      } else {
        statusEl.textContent = 'measuring';
        statusEl.className   = 'measuring';
      }
    });
  </script>
</body>
</html>
