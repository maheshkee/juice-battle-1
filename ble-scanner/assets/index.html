<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔵 BLE Scanner</h1>
    <button id="scan-btn" onclick="scan()">Scan for Devices</button>
    <div id="status"></div>
    <table id="device-table">
      <thead>
        <tr><th>Name</th><th>Address</th><th>RSSI</th><th>Action</th></tr>
      </thead>
      <tbody id="device-list"></tbody>
    </table>

    <div id="detail-panel" class="hidden">
      <h2>Device: <span id="selected-address"></span></h2>
      <div class="row">
        <input id="char-uuid" type="text" placeholder="Characteristic UUID" />
        <button onclick="readChar()">Read</button>
      </div>
      <div class="row">
        <input id="write-data" type="text" placeholder="Data (hex)" />
        <button onclick="writeChar()">Write</button>
      </div>
      <div id="char-result"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
