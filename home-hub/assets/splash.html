<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
  body { background: #0f0f0f; width: 100vw; height: 100vh; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

  #home {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0a0a0a;
  }

  /* ── Weight scale dashboard ── */
  .scale-topbar {
    position: absolute; top: 28px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: baseline; gap: 16px;
  }
  .scale-time { font-size: 22px; font-weight: 200; color: #444;
    font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
  .scale-date { font-size: 13px; color: #2a2a2a; letter-spacing: 0.2em;
    text-transform: uppercase; }

  .scale-ring-wrap {
    position: relative; width: 320px; height: 320px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
  }
  .scale-ring {
    position: absolute; top: 0; left: 0;
    width: 320px; height: 320px;
  }
  .scale-center {
    display: flex; flex-direction: column; align-items: center; z-index: 1;
  }
  .scale-kg {
    font-size: 80px; font-weight: 100; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1;
  }
  .scale-unit { font-size: 22px; color: #555; font-weight: 300;
    letter-spacing: 0.15em; margin-top: 6px; }
  .scale-status {
    font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
    margin-top: 8px; font-weight: 400;
    transition: color 0.4s ease;
  }
  .scale-status.stable  { color: #00c853; }
  .scale-status.measuring { color: #ff6f00; }
  .scale-status.waiting { color: #333; }

  .scale-raw {
    font-size: 13px; font-family: monospace; color: #2a2a2a;
    letter-spacing: 0.1em; margin-top: 12px;
  }
  .scale-raw span { color: #444; }

  @keyframes spin-ring {
    from { stroke-dashoffset: 754; }
    to   { stroke-dashoffset: 0; }
  }
  #player-wrap {
    width: 100vw; height: 100vh;
    display: none; position: fixed;
    top: 0; left: 0; background: #000;
  }
  #yt-player { width: 100%; height: 100%; }

  #local-wrap {
    width: 100vw; height: 100vh;
    display: none; position: fixed;
    top: 0; left: 0; background: #000;
  }
  #local-video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }

  .logo {
    width: 80px; height: 80px; background: #ff0000;
    border-radius: 18px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 32px;
    animation: pulse 2s ease-in-out infinite;
  }
  .play-icon {
    width: 0; height: 0;
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
    border-left: 38px solid white;
    margin-left: 8px;
  }
  .clock { font-size: 120px; font-weight: 100; color: #fff;
    letter-spacing: 0.05em; line-height: 1; margin-bottom: 8px;
    font-variant-numeric: tabular-nums; }
  .seconds { font-size: 48px; color: #ff0000; font-weight: 100;
    letter-spacing: 0.1em; vertical-align: super; margin-left: 6px; }
  .date { font-size: 16px; color: #333; letter-spacing: 0.25em;
    text-transform: uppercase; margin-bottom: 60px; margin-top: 4px; }
  .divider { width: 40px; height: 1px; background: #1a1a1a; margin-bottom: 52px; }
  .tagline { color: #2a2a2a; font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 10px; }
  .ip { color: #cc0000; font-size: 14px; font-family: monospace; letter-spacing: 0.12em; }
  .dots { display: flex; gap: 8px; margin-top: 40px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1a1a1a;
    animation: dotpulse 1.4s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  .colon { animation: blink 1s step-end infinite; }
  .ble-status {
    margin-top: 28px; font-size: 12px; letter-spacing: 0.2em;
    text-transform: uppercase; color: #1a1a1a; transition: color 0.5s ease;
  }
  .ble-status.connected { color: #cc0000; }
  .ble-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #1a1a1a; margin-right: 8px; vertical-align: middle;
    transition: background 0.5s ease;
  }
  .ble-status.connected .ble-dot { background: #cc0000; }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.3); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255,0,0,0); }
  }
  @keyframes dotpulse {
    0%,80%,100% { background: #1a1a1a; transform: scale(1); }
    40% { background: #ff0000; transform: scale(1.4); }
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
</style>
</head>
<body>

<div id="home">

  <div class="scale-topbar">
    <span class="scale-time" id="sc-time">00:00</span>
    <span class="scale-date" id="sc-date"></span>
  </div>

  <div class="scale-ring-wrap">
    <!-- ring SVG — stroke animates to show stable/measuring state -->
    <svg class="scale-ring" viewBox="0 0 320 320">
      <!-- track -->
      <circle cx="160" cy="160" r="140" fill="none" stroke="#1a1a1a" stroke-width="6"/>
      <!-- progress ring — driven by JS -->
      <circle id="ring-progress" cx="160" cy="160" r="140" fill="none"
        stroke="#00c853" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="880" stroke-dashoffset="880"
        transform="rotate(-90 160 160)"
        style="transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease;"/>
    </svg>
    <div class="scale-center">
      <div class="scale-kg" id="weight-value">--</div>
      <div class="scale-unit">kg</div>
      <div class="scale-status waiting" id="scale-status">waiting</div>
    </div>
  </div>

  <div class="scale-raw">raw&nbsp;<span id="raw-value">--</span></div>

</div>

<!-- YouTube player -->
<div id="player-wrap">
  <div id="yt-player"></div>
</div>

<!-- Local video player -->
<div id="local-wrap">
  <video id="local-video" autoplay playsinline></video>
</div>

<script src="/socket.io.min.js"></script>
<script>
const DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

function pad(n){ return String(n).padStart(2,"0"); }
function tick(){
  const now = new Date();
  document.getElementById("sc-time").textContent =
    pad(now.getHours()) + ":" + pad(now.getMinutes());
  document.getElementById("sc-date").textContent =
    DAYS[now.getDay()] + " " + now.getDate() + " " + MONTHS[now.getMonth()];
}
tick();
setInterval(tick, 1000);

// ── State ────────────────────────────────────────────────────────────────────
let ytPlayer       = null;
let currentVideoId = null;
let ytReady        = false;
let currentMode    = "home"; // "home" | "youtube" | "local"

// ── YouTube IFrame API ───────────────────────────────────────────────────────
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  ytReady = true;
  console.log("[YT] API ready");
};

function showHome() {
  document.getElementById("home").style.display        = "flex";
  document.getElementById("player-wrap").style.display = "none";
  document.getElementById("local-wrap").style.display  = "none";
  if (ytPlayer) ytPlayer.stopVideo();
  const vid = document.getElementById("local-video");
  vid.pause();
  vid.src = "";
  currentVideoId = null;
  currentMode    = "home";
}

function showYoutube(videoId) {
  currentVideoId = videoId;
  currentMode    = "youtube";
  document.getElementById("home").style.display        = "none";
  document.getElementById("local-wrap").style.display  = "none";
  document.getElementById("player-wrap").style.display = "block";

  if (ytPlayer) {
    ytPlayer.loadVideoById(videoId);
    ytPlayer.playVideo();
    return;
  }

  ytPlayer = new YT.Player("yt-player", {
    width: window.innerWidth,
    height: window.innerHeight,
    videoId: videoId,
    playerVars: {
      autoplay: 1, controls: 0, modestbranding: 1,
      rel: 0, iv_load_policy: 3, fs: 0
    },
    events: {
      onReady: e => {
        e.target.setVolume(100);
        e.target.playVideo();
      },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED && currentVideoId) {
          socket.emit("video_ended", {videoId: currentVideoId});
          ytPlayer.loadVideoById(currentVideoId);
          ytPlayer.playVideo();
        }
      }
    }
  });
}

function showLocal(filename) {
  currentMode = "local";
  document.getElementById("home").style.display        = "none";
  document.getElementById("player-wrap").style.display = "none";
  document.getElementById("local-wrap").style.display  = "block";

  const vid = document.getElementById("local-video");
  vid.src = "/videos/" + filename;
  vid.load();
  vid.play().catch(e => console.log("[LOCAL] play error:", e));

  vid.onended = () => {
    socket.emit("video_ended", {filename: filename});
  };
}

// ── Socket.IO ────────────────────────────────────────────────────────────────
const socket = io();

socket.on("play_video_display", data => {
  console.log("[DISPLAY] YT:", data.video_id);
  if (ytReady) {
    showYoutube(data.video_id);
  } else {
    const wait = setInterval(() => {
      if (ytReady) { clearInterval(wait); showYoutube(data.video_id); }
    }, 200);
  }
});

socket.on("play_local_display", data => {
  console.log("[DISPLAY] Local:", data.filename);
  showLocal(data.filename);
});

socket.on("player_control", data => {
  const action = data.action;
  console.log("[CONTROL]", action);

  if (action === "stop") { showHome(); return; }

  if (currentMode === "youtube" && ytPlayer) {
    if (action === "pause")    ytPlayer.pauseVideo();
    if (action === "resume")   ytPlayer.playVideo();
    if (action === "vol_up")   ytPlayer.setVolume(Math.min(100, ytPlayer.getVolume() + 10));
    if (action === "vol_down") ytPlayer.setVolume(Math.max(0,   ytPlayer.getVolume() - 10));
  }

  if (currentMode === "local") {
    const vid = document.getElementById("local-video");
    if (action === "pause")    vid.pause();
    if (action === "resume")   vid.play();
    if (action === "vol_up")   vid.volume = Math.min(1, vid.volume + 0.1);
    if (action === "vol_down") vid.volume = Math.max(0, vid.volume - 0.1);
  }
});

socket.on("ble_connected", data => {
  const el = document.getElementById("ble-status");
  const lb = document.getElementById("ble-label");
  el.classList.add("connected");
  lb.textContent = (data.device || "Phone") + " connected";
});

socket.on("ble_disconnected", () => {
  const el = document.getElementById("ble-status");
  const lb = document.getElementById("ble-label");
  el.classList.remove("connected");
  lb.textContent = "Waiting for connection";
});

// weight_update payload: { weight_kg: float, raw: int, stable: bool }
// Falls back gracefully if fields are missing (demo / partial data)
socket.on('weight_update', function(data) {
  const kg     = (data.weight_kg !== undefined) ? data.weight_kg : (data.weight_g / 1000);
  const raw    = (data.raw !== undefined) ? data.raw : (data.raw_kg || '--');
  const stable = !!data.stable;

  // weight display — 3 decimal places, clamp negatives to 0.000
  document.getElementById('weight-value').textContent =
    (kg < 0 ? 0 : kg).toFixed(3);
  document.getElementById('raw-value').textContent = raw;

  // status label + ring colour
  const statusEl = document.getElementById('scale-status');
  const ring     = document.getElementById('ring-progress');
  if (stable) {
    statusEl.className = 'scale-status stable';
    statusEl.textContent = 'stable';
    ring.style.stroke = '#00c853';
  } else {
    statusEl.className = 'scale-status measuring';
    statusEl.textContent = 'measuring';
    ring.style.stroke = '#ff6f00';
  }

  // ring fill: 0 kg = empty, 30 kg = full (covers max cylinder weight)
  const MAX_KG = 30;
  const pct    = Math.min(1, Math.max(0, kg / MAX_KG));
  const CIRC   = 880;
  ring.style.strokeDashoffset = CIRC - pct * CIRC;
});
</script>
</body>
</html>
