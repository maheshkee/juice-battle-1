<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" viewBox="0 0 680 1640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HX711 test flow — S1 to S3 complete code and mechanism walkthrough</title>
<desc>Flowchart showing every code step from boot to S3 with the HX711 mechanism at each stage</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; fill: #2C2C2A; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .c-gray   { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-teal   { fill: #E1F5EE; stroke: #0F6E56; }
    .c-amber  { fill: #FAEEDA; stroke: #854F0B; }
    .c-coral  { fill: #FAECE7; stroke: #993C1D; }
    .c-purple { fill: #EEEDFE; stroke: #534AB7; }
    .c-green-box { fill: #EAF3DE; stroke: #3B6D11; }
    .mono { font-family: "Courier New", monospace; font-size: 11px; }
  </style>
</defs>

<!-- BOOT -->
<rect x="190" y="20" width="300" height="44" rx="22" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Boot — setup() begins</text>
<line x1="340" y1="64" x2="340" y2="90" class="arr" marker-end="url(#arrow)"/>

<!-- INIT -->
<rect x="120" y="90" width="440" height="56" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="110" text-anchor="middle" dominant-baseline="central">Hardware init</text>
<text class="ts" x="340" y="130" text-anchor="middle">pinMode SCK=OUTPUT LOW, DT=INPUT_PULLUP</text>
<text class="ts" x="580" y="112" fill="#5F5E5A">SCK held LOW.</text>
<text class="ts" x="580" y="126" fill="#5F5E5A">HX711 normal mode.</text>
<line x1="340" y1="146" x2="340" y2="172" class="arr" marker-end="url(#arrow)"/>

<!-- BRIDGE + DELAY -->
<rect x="120" y="172" width="440" height="56" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="192" text-anchor="middle" dominant-baseline="central">Bridge.begin() + delay(8000ms)</text>
<text class="ts" x="340" y="212" text-anchor="middle">MCU waits for Python container to be ready</text>
<text class="ts" x="580" y="192" fill="#5F5E5A">HX711 running.</text>
<text class="ts" x="580" y="206" fill="#5F5E5A">First conversions</text>
<text class="ts" x="580" y="220" fill="#5F5E5A">happening now.</text>
<line x1="340" y1="228" x2="340" y2="254" class="arr" marker-end="url(#arrow)"/>

<!-- WAIT DOUT LOW -->
<rect x="120" y="254" width="440" height="56" rx="6" class="c-amber" stroke-width="0.5"/>
<text class="th" x="340" y="274" text-anchor="middle" dominant-baseline="central">while (digitalRead(DT) == HIGH) {}</text>
<text class="ts" x="340" y="294" text-anchor="middle">Poll DOUT. Wait until HX711 signals data ready.</text>
<text class="ts" x="580" y="268" fill="#854F0B">MCU checks D7.</text>
<text class="ts" x="580" y="282" fill="#854F0B">No SCK pulses.</text>
<text class="ts" x="580" y="296" fill="#854F0B">DOUT goes LOW</text>
<text class="ts" x="580" y="310" fill="#854F0B">when ready.</text>
<line x1="340" y1="310" x2="340" y2="336" class="arr" marker-end="url(#arrow)"/>

<!-- S1 READ -->
<rect x="40" y="336" width="44" height="100" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="62" y="368" text-anchor="middle" fill="#2C2C2A">24</text>
<text class="ts" x="62" y="384" text-anchor="middle" fill="#2C2C2A">SCK</text>
<text class="ts" x="62" y="400" text-anchor="middle" fill="#2C2C2A">pulses</text>
<text class="ts" x="62" y="416" text-anchor="middle" fill="#2C2C2A">+25th</text>
<rect x="90" y="336" width="500" height="100" rx="6" class="c-teal" stroke-width="0.5"/>
<text class="th" x="340" y="358" text-anchor="middle" dominant-baseline="central">S1 = hx711_read_raw()</text>
<text class="ts" x="340" y="378" text-anchor="middle">Loop i=0..23: SCK HIGH, read DT bit, SCK LOW</text>
<text class="ts" x="340" y="396" text-anchor="middle">Collects 24 bits MSB first. Sign extends to int32.</text>
<text class="ts" x="340" y="414" text-anchor="middle">25th pulse fires → DOUT HIGH → fresh conversion starts.</text>
<line x1="340" y1="436" x2="340" y2="462" class="arr" marker-end="url(#arrow)"/>

<!-- LOG S1 -->
<rect x="160" y="462" width="360" height="44" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="480" text-anchor="middle" dominant-baseline="central">Bridge.notify("log", "S1 = -1 at t=8330ms")</text>
<text class="ts" x="340" y="498" text-anchor="middle">Fire-and-forget to Python. Non-blocking.</text>
<line x1="340" y1="506" x2="340" y2="532" class="arr" marker-end="url(#arrow)"/>

<!-- PAUSE PREAMBLE -->
<rect x="160" y="532" width="360" height="44" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="550" text-anchor="middle" dominant-baseline="central">Print pause instructions</text>
<text class="ts" x="340" y="568" text-anchor="middle">Action window / settle window messages sent</text>
<line x1="340" y1="576" x2="340" y2="602" class="arr" marker-end="url(#arrow)"/>

<!-- 30S PAUSE LOOP -->
<rect x="40" y="602" width="44" height="130" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="62" y="634" text-anchor="middle" fill="#712B13">NO</text>
<text class="ts" x="62" y="650" text-anchor="middle" fill="#712B13">SCK</text>
<text class="ts" x="62" y="666" text-anchor="middle" fill="#712B13">pulses</text>
<text class="ts" x="62" y="686" text-anchor="middle" fill="#712B13">HX711</text>
<text class="ts" x="62" y="702" text-anchor="middle" fill="#712B13">frozen</text>
<text class="ts" x="62" y="718" text-anchor="middle" fill="#712B13">DOUT</text>
<text class="ts" x="62" y="734" text-anchor="middle" fill="#712B13">LOW</text>
<rect x="90" y="602" width="500" height="130" rx="6" class="c-coral" stroke-width="0.5"/>
<text class="th" x="340" y="624" text-anchor="middle" dominant-baseline="central">30-second pause loop (for sec=0..29)</text>
<text class="ts" x="340" y="648" text-anchor="middle" font-family="Courier New, monospace">while (millis() - pause_start &lt; (sec+1)*1000) { delay(1); }</text>
<text class="ts" x="340" y="668" text-anchor="middle" font-family="Courier New, monospace">int dout = digitalRead(DT);  // only GPIO action</text>
<text class="ts" x="340" y="688" text-anchor="middle" font-family="Courier New, monospace">Bridge.notify("log", "t=Xs DOUT=LOW")</text>
<text class="ts" x="340" y="708" text-anchor="middle">At sec==10: print action window closed</text>

<!-- Weight added annotation -->
<rect x="596" y="630" width="76" height="72" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="ts" x="634" y="650" text-anchor="middle" fill="#085041">YOU add</text>
<text class="ts" x="634" y="666" text-anchor="middle" fill="#085041">weight</text>
<text class="ts" x="634" y="682" text-anchor="middle" fill="#085041">t=0..10s</text>
<text class="ts" x="634" y="698" text-anchor="middle" fill="#085041">HX711</text>
<text class="ts" x="634" y="714" text-anchor="middle" fill="#085041">blind</text>

<line x1="340" y1="732" x2="340" y2="758" class="arr" marker-end="url(#arrow)"/>

<!-- PAUSE END -->
<rect x="160" y="758" width="360" height="30" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="773" text-anchor="middle" dominant-baseline="central">Print: "PAUSE END — reading S2 now"</text>
<line x1="340" y1="788" x2="340" y2="814" class="arr" marker-end="url(#arrow)"/>

<!-- POLL DOUT BEFORE S2 -->
<rect x="120" y="814" width="440" height="44" rx="6" class="c-amber" stroke-width="0.5"/>
<text class="th" x="340" y="830" text-anchor="middle" dominant-baseline="central">while (digitalRead(DT) == HIGH) {}</text>
<text class="ts" x="340" y="848" text-anchor="middle">Protocol check. DOUT was already LOW — returns instantly.</text>
<text class="ts" x="580" y="826" fill="#0F6E56">DOUT was LOW</text>
<text class="ts" x="580" y="840" fill="#0F6E56">for 30 seconds.</text>
<text class="ts" x="580" y="854" fill="#0F6E56">No wait needed.</text>
<line x1="340" y1="858" x2="340" y2="884" class="arr" marker-end="url(#arrow)"/>

<!-- S2 READ -->
<rect x="40" y="884" width="44" height="100" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="62" y="910" text-anchor="middle" fill="#2C2C2A">24+1</text>
<text class="ts" x="62" y="926" text-anchor="middle" fill="#2C2C2A">SCK</text>
<text class="ts" x="62" y="942" text-anchor="middle" fill="#2C2C2A">pulses</text>
<text class="ts" x="62" y="960" text-anchor="middle" fill="#993C1D">H1</text>
<text class="ts" x="62" y="974" text-anchor="middle" fill="#993C1D">proven</text>
<rect x="90" y="884" width="500" height="100" rx="6" class="c-teal" stroke-width="0.5"/>
<text class="th" x="340" y="906" text-anchor="middle" dominant-baseline="central">S2 = hx711_read_raw()</text>
<text class="ts" x="340" y="926" text-anchor="middle">Same 24-bit read. Returns frozen pre-pause value.</text>
<text class="ts" x="340" y="944" text-anchor="middle">S2 = -1. Identical to S1. Weight change invisible.</text>
<text class="ts" x="340" y="962" text-anchor="middle">25th pulse → DOUT HIGH at +0ms → fresh conversion starts.</text>
<line x1="340" y1="984" x2="340" y2="1010" class="arr" marker-end="url(#arrow)"/>

<!-- LOG S2 -->
<rect x="160" y="1010" width="360" height="44" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="1028" text-anchor="middle" dominant-baseline="central">Bridge.notify("log", "S2 = -1 at t=38356ms")</text>
<text class="ts" x="340" y="1046" text-anchor="middle">S2 = S1. Freeze confirmed.</text>
<line x1="340" y1="1054" x2="340" y2="1080" class="arr" marker-end="url(#arrow)"/>

<!-- TRACK CONVERSION TIMING -->
<rect x="90" y="1080" width="500" height="80" rx="6" class="c-amber" stroke-width="0.5"/>
<text class="th" x="340" y="1102" text-anchor="middle" dominant-baseline="central">Track next conversion timing</text>
<text class="ts" x="340" y="1122" text-anchor="middle" font-family="Courier New, monospace">while (digitalRead(DT)==LOW) {}   // wait HIGH = conversion start</text>
<text class="ts" x="340" y="1142" text-anchor="middle" font-family="Courier New, monospace">while (digitalRead(DT)==HIGH) {}  // wait LOW  = conversion done</text>
<text class="ts" x="596" y="1100" fill="#5F5E5A">HIGH at +0ms</text>
<text class="ts" x="596" y="1114" fill="#5F5E5A">LOW at +554ms</text>
<line x1="340" y1="1160" x2="340" y2="1186" class="arr" marker-end="url(#arrow)"/>

<!-- LOG TIMING -->
<rect x="120" y="1186" width="440" height="44" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="1204" text-anchor="middle" dominant-baseline="central">Print: "DOUT HIGH +0ms, LOW +554ms"</text>
<text class="ts" x="340" y="1222" text-anchor="middle">554ms settling after long stall. Datasheet spec: 400ms.</text>
<line x1="340" y1="1230" x2="340" y2="1256" class="arr" marker-end="url(#arrow)"/>

<!-- S3 READ -->
<rect x="40" y="1256" width="44" height="100" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="62" y="1282" text-anchor="middle" fill="#085041">24+1</text>
<text class="ts" x="62" y="1298" text-anchor="middle" fill="#085041">SCK</text>
<text class="ts" x="62" y="1314" text-anchor="middle" fill="#085041">pulses</text>
<text class="ts" x="62" y="1334" text-anchor="middle" fill="#085041">fresh</text>
<text class="ts" x="62" y="1350" text-anchor="middle" fill="#085041">data</text>
<rect x="90" y="1256" width="500" height="100" rx="6" class="c-teal" stroke-width="0.5"/>
<text class="th" x="340" y="1278" text-anchor="middle" dominant-baseline="central">S3 = hx711_read_raw()</text>
<text class="ts" x="340" y="1298" text-anchor="middle">First fresh conversion after the stall.</text>
<text class="ts" x="340" y="1316" text-anchor="middle">S3 = 10308. Reflects actual weight on scale.</text>
<text class="ts" x="340" y="1334" text-anchor="middle">Jump from -1 to 10308 = H1 fully confirmed.</text>
<line x1="340" y1="1356" x2="340" y2="1382" class="arr" marker-end="url(#arrow)"/>

<!-- LOG S3 -->
<rect x="160" y="1382" width="360" height="44" rx="6" class="c-gray" stroke-width="0.5"/>
<text class="th" x="340" y="1400" text-anchor="middle" dominant-baseline="central">Print S3 + interpretation</text>
<text class="ts" x="340" y="1418" text-anchor="middle">S2 approx S1, S3 differs → H1 (freeze) confirmed</text>
<line x1="340" y1="1426" x2="340" y2="1452" class="arr" marker-end="url(#arrow)"/>

<!-- END -->
<rect x="190" y="1452" width="300" height="44" rx="22" class="c-purple" stroke-width="0.5"/>
<text class="th" x="340" y="1474" text-anchor="middle" dominant-baseline="central">delay(120000) — idle, repeat</text>

<!-- LEGEND -->
<rect x="40" y="1516" width="14" height="14" rx="2" class="c-teal" stroke-width="0.5"/>
<text class="ts" x="62" y="1527" fill="#2C2C2A">hx711_read_raw() — 24+1 SCK pulses fired</text>
<rect x="40" y="1538" width="14" height="14" rx="2" class="c-amber" stroke-width="0.5"/>
<text class="ts" x="62" y="1549" fill="#2C2C2A">DOUT poll — read-only, no SCK pulses</text>
<rect x="40" y="1560" width="14" height="14" rx="2" class="c-coral" stroke-width="0.5"/>
<text class="ts" x="62" y="1571" fill="#2C2C2A">Pause window — SCK silent — HX711 frozen</text>
<rect x="40" y="1582" width="14" height="14" rx="2" class="c-gray" stroke-width="0.5"/>
<text class="ts" x="62" y="1593" fill="#2C2C2A">Code overhead — logging, setup, delays</text>
<rect x="40" y="1604" width="14" height="14" rx="2" class="c-purple" stroke-width="0.5"/>
<text class="ts" x="62" y="1615" fill="#2C2C2A">Loop boundary — test repeats after 120s</text>
</svg>
