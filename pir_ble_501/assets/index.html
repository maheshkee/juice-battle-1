<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIR Receiver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="brand-dot"></div>
      <div>
        <h1>PIR Motion Receiver</h1>
        <p class="sub">Arduino UNO Q — ESP32 BLE → UNO Q</p>
      </div>
    </div>
    <div id="conn-status" class="conn-badge disconnected">● Connecting...</div>
  </div>

  <div class="ble-bar">
    <div class="ble-dot" id="ble-dot"></div>
    <span id="ble-text">Scanning for PIR-ESP32...</span>
  </div>

  <div class="main-grid">
    <div class="status-card">
      <div id="status-circle" class="status-circle waiting">
        <span id="circle-text">WAITING</span>
      </div>
      <div id="status-text" class="status-label">Waiting for board...</div>
      <div id="last-time" class="last-time">Last event: Never</div>
    </div>

    <div class="stats-col">
      <div class="stat-card accent-card">
        <div class="stat-label">Current status</div>
        <div class="stat-value" id="stat-status">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total triggers</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last trigger</div>
        <div class="stat-value small" id="stat-time">--:--:--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Source</div>
        <div class="stat-value small">ESP32 via BLE</div>
      </div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">Event log</div>
    <div id="log">
      <div class="log-entry empty-entry">Waiting for events...</div>
    </div>
  </div>

  <script src="libs/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
