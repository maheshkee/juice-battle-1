<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
  body { background: #0f0f0f; width: 100vw; height: 100vh; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #home {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #player-wrap {
    width: 100vw; height: 100vh;
    display: none; position: fixed;
    top: 0; left: 0; background: #000;
  }
  #yt-player { width: 100%; height: 100%; }
  .logo {
    width: 80px; height: 80px; background: #ff0000;
    border-radius: 18px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 32px;
    animation: pulse 2s ease-in-out infinite;
  }
  .play-icon {
    width: 0; height: 0;
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
    border-left: 38px solid white;
    margin-left: 8px;
  }
  .clock { font-size: 120px; font-weight: 100; color: #fff;
    letter-spacing: 0.05em; line-height: 1; margin-bottom: 8px;
    font-variant-numeric: tabular-nums; }
  .seconds { font-size: 48px; color: #ff0000; font-weight: 100;
    letter-spacing: 0.1em; vertical-align: super; margin-left: 6px; }
  .date { font-size: 16px; color: #333; letter-spacing: 0.25em;
    text-transform: uppercase; margin-bottom: 60px; margin-top: 4px; }
  .divider { width: 40px; height: 1px; background: #1a1a1a; margin-bottom: 52px; }
  .tagline { color: #2a2a2a; font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 10px; }
  .ip { color: #cc0000; font-size: 14px; font-family: monospace; letter-spacing: 0.12em; }
  .dots { display: flex; gap: 8px; margin-top: 40px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1a1a1a;
    animation: dotpulse 1.4s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  .colon { animation: blink 1s step-end infinite; }
  .ble-status {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #1a1a1a;
    transition: color 0.5s ease;
  }
  .ble-status.connected { color: #cc0000; }
  .ble-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #1a1a1a;
    margin-right: 8px;
    vertical-align: middle;
    transition: background 0.5s ease;
  }
  .ble-status.connected .ble-dot { background: #cc0000; }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.3); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255,0,0,0); }
  }
  @keyframes dotpulse {
    0%,80%,100% { background: #1a1a1a; transform: scale(1); }
    40% { background: #ff0000; transform: scale(1.4); }
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
</style>
</head>
<body>

<div id="home">
  <div class="clock">
    <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="seconds" id="ss">00</span>
  </div>
  <div class="date" id="date"></div>
  <div class="divider"></div>
  <div class="logo"><div class="play-icon"></div></div>
  <p class="tagline">Your screen is ready to stream</p>
  <p class="ip" id="board-ip">loading...</p>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<div id="player-wrap">
  <div id="yt-player"></div>
</div>

<script src="/socket.io.min.js"></script>
<script>
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function pad(n){ return String(n).padStart(2,'0'); }
function tick(){
  const now = new Date();
  document.getElementById('hh').textContent = pad(now.getHours());
  document.getElementById('mm').textContent = pad(now.getMinutes());
  document.getElementById('ss').textContent = pad(now.getSeconds());
  document.getElementById('date').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + ' ' +
    MONTHS[now.getMonth()] + ' ' + now.getFullYear();
}
tick();
setInterval(tick, 1000);

document.getElementById('board-ip').textContent = window.location.hostname + ':7000';

let player = null;
let currentVideoId = null;
let ytReady = false;

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  ytReady = true;
  console.log('[YT] API ready');
};

function initPlayer(videoId) {
  currentVideoId = videoId;
  document.getElementById('home').style.display = 'none';
  document.getElementById('player-wrap').style.display = 'block';

  if (player) {
    player.loadVideoById(videoId);
    player.playVideo();
    return;
  }

  player = new YT.Player('yt-player', {
    width: window.innerWidth,
    height: window.innerHeight,
    videoId: videoId,
    playerVars: {
      autoplay: 1, controls: 0, modestbranding: 1,
      rel: 0, iv_load_policy: 3, fs: 0, loop: 1,
      playlist: videoId
    },
    events: {
      onReady: e => e.target.playVideo(),
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED && currentVideoId) {
          player.loadVideoById(currentVideoId);
        }
      }
    }
  });
}

function showHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('player-wrap').style.display = 'none';
  if (player) player.stopVideo();
  currentVideoId = null;
}

const socket = io();

socket.on('play_video_display', data => {
  console.log('[DISPLAY] Playing:', data.video_id);
  if (ytReady) {
    initPlayer(data.video_id);
  } else {
    const wait = setInterval(() => {
      if (ytReady) {
        clearInterval(wait);
        initPlayer(data.video_id);
      }
    }, 200);
  }
});

socket.on('ble_connected', data => {
  const el = document.getElementById('ble-status');
  const lb = document.getElementById('ble-label');
  el.classList.add('connected');
  lb.textContent = data.device + ' connected';
});
socket.on('ble_disconnected', data => {
  const el = document.getElementById('ble-status');
  const lb = document.getElementById('ble-label');
  el.classList.remove('connected');
  lb.textContent = 'Waiting for connection';
});
socket.on('player_control', data => {
  console.log('[CONTROL]', data.action);
  if (!player) return;
  if (data.action === 'pause')    player.pauseVideo();
  if (data.action === 'resume')   player.playVideo();
  if (data.action === 'stop')     showHome();
  if (data.action === 'vol_up')   player.setVolume(Math.min(100, player.getVolume() + 10));
  if (data.action === 'vol_down') player.setVolume(Math.max(0,   player.getVolume() - 10));
});
</script>
</body>
</html>
