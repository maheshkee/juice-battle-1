<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BLE Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        /* ---- layout roots ---- */
        #layout-overlay {
            position: absolute;
            inset: 0;
        }
        #layout-split {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: row;
        }
        #layout-split.active {
            display: flex;
        }
        #split-left {
            flex: 0 0 65%;
            position: relative;
            overflow: hidden;
        }
        #split-right {
            flex: 0 0 35%;
            background: #05090f;
            border-left: 1px solid rgba(0, 229, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 32px 24px;
        }

        /* ---- overlay screens (used in both layouts) ---- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .screen.active { display: flex; }

        #idle-screen {
            background: radial-gradient(ellipse at 30% 40%, #0a0a2e 0%, #000 70%);
            flex-direction: column;
            gap: 24px;
        }
        .idle-logo {
            font-size: 5rem;
            animation: pulse-logo 3s ease-in-out infinite;
        }
        .idle-title {
            font-size: 1.4rem;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }
        .idle-hint {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.15em;
            animation: blink 2.5s ease-in-out infinite;
        }
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: float-up linear infinite;
        }
        #youtube-screen { background: #000; }
        #player-overlay { width: 100%; height: 100%; }

        #clock-screen {
            background: #000;
            flex-direction: column;
            gap: 12px;
        }
        .clock-time {
            font-size: clamp(4rem, 18vw, 14rem);
            font-weight: 100;
            letter-spacing: -0.02em;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .clock-time .colon {
            animation: blink 1s step-end infinite;
            display: inline-block;
            width: 0.35em;
            text-align: center;
        }
        .clock-date {
            font-size: clamp(1rem, 2.5vw, 2rem);
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .clock-seconds-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255,255,255,0.6);
            transition: width 1s linear;
        }

        /* ---- split youtube container ---- */
        #youtube-split-wrap {
            display: none;
            position: absolute;
            inset: 0;
            background: #000;
        }
        #youtube-split-wrap.active {
            display: block;
        }
        #player-split {
            width: 100%;
            height: 100%;
        }

        /* ---- toast ---- */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            padding: 10px 24px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.05em;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ---- gas widget ---- */
        #gas-idle-widget {
            position: absolute;
            bottom: 18px;
            right: 18px;
            background: rgba(0,0,0,0.55);
            border-radius: 12px;
            padding: 8px 14px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        #gas-idle-widget .gas-pct { font-weight: bold; font-size: 1rem; }
        #gas-idle-widget .gas-days { opacity: 0.75; font-size: 0.78rem; }
        #gas-overlay-pill {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        #gas-overlay-pill .gas-pct { font-weight: bold; }
        #gas-panel {
            margin-top: 16px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-family: monospace;
            color: #fff;
            text-align: center;
        }
        #gas-panel .gas-pct-large {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1;
        }
        #gas-panel .gas-bar-wrap {
            margin: 8px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
        }
        #gas-panel .gas-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        #gas-panel .gas-meta {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 4px;
        }
        #gas-setup-btn {
            position: absolute;
            bottom: 18px;
            left: 18px;
            background: rgba(245,158,11,0.15);
            border: 1px solid rgba(245,158,11,0.4);
            border-radius: 10px;
            padding: 8px 16px;
            color: #f59e0b;
            font-family: monospace;
            font-size: 0.82rem;
            cursor: pointer;
            display: none;
            z-index: 10;
        }
        #gas-setup-btn:hover { background: rgba(245,158,11,0.3); }
        #gas-uninstall-btn {
            position: absolute;
            bottom: 18px;
            left: 18px;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 10px;
            padding: 8px 16px;
            color: #ef4444;
            font-family: monospace;
            font-size: 0.82rem;
            cursor: pointer;
            display: none;
            z-index: 10;
        }
        #gas-uninstall-btn:hover { background: rgba(239,68,68,0.3); }
        #gas-calibrating {
            position: absolute;
            bottom: 55px;
            left: 18px;
            color: #f59e0b;
            font-family: monospace;
            font-size: 0.78rem;
            display: none;
            z-index: 10;
        }
        .gas-green { color: #4caf50; }
        .gas-amber { color: #ff9800; }
        .gas-red   { color: #f44336; }
        .gas-bar-green { background: #4caf50; }
        .gas-bar-amber { background: #ff9800; }
        .gas-bar-red   { background: #f44336; }

        /* ---- whistle overlay (overlay mode) ---- */
        #whistle-overlay {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
            transform: scale(0.85);
            opacity: 0;
        }
        #whistle-overlay.visible {
            opacity: 1;
            transform: scale(1);
        }
        .whistle-card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px 28px 14px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border: 1.5px solid rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.05),
                        inset 0 1px 0 rgba(255,255,255,0.06);
            min-width: 160px;
        }
        .whistle-card.active {
            border-color: rgba(52, 199, 89, 0.4);
            box-shadow: 0 0 50px rgba(52, 199, 89, 0.12),
                        0 0 100px rgba(52, 199, 89, 0.06),
                        inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* ---- whistle panel (split mode right pane) ---- */
        #whistle-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .panel-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .panel-number {
            font-size: clamp(7rem, 14vw, 11rem);
            font-weight: 100;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            color: rgba(255,255,255,0.25);
            text-shadow: none;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .panel-number.active {
            color: #00E5FF;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.5),
                         0 0 80px rgba(0, 229, 255, 0.2);
        }
        .panel-number.complete {
            color: #34C759;
            text-shadow: 0 0 40px rgba(52, 199, 89, 0.6),
                         0 0 100px rgba(52, 199, 89, 0.3);
        }
        .panel-label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .panel-divider {
            width: 80%;
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 0 auto 20px;
        }
        .panel-progress-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .panel-progress-bar {
            width: 85%;
            height: 6px;
            background: rgba(255,255,255,0.07);
            border-radius: 3px;
            overflow: hidden;
        }
        .panel-progress-fill {
            height: 100%;
            border-radius: 3px;
            background: #00E5FF;
            transition: width 0.4s ease, background 0.3s;
        }
        .panel-progress-fill.complete {
            background: #34C759;
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.6);
        }
        .panel-fraction {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.08em;
        }
        .panel-status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }

        /* shared whistle atoms */
        .whistle-top {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        .whistle-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a5568;
            flex-shrink: 0;
        }
        .whistle-dot.pulse {
            background: #34C759;
            animation: dot-pulse 1.2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.8);
        }
        .whistle-dot.lg {
            width: 11px;
            height: 11px;
        }
        .whistle-status-text {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
        }
        .whistle-status-text.active {
            color: rgba(52, 199, 89, 0.7);
        }
        .whistle-status-text.lg {
            font-size: 0.75rem;
        }
        .whistle-number {
            font-size: 7rem;
            font-weight: 100;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            color: #fff;
            text-shadow: none;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .whistle-number.active {
            color: #00E5FF;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.5),
                         0 0 60px rgba(0, 229, 255, 0.2);
        }
        .whistle-number.complete {
            color: #34C759;
            text-shadow: 0 0 30px rgba(52, 199, 89, 0.6),
                         0 0 80px rgba(52, 199, 89, 0.3);
        }
        .whistle-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 2px 0;
        }
        .whistle-progress-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .whistle-progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        .whistle-progress-fill {
            height: 100%;
            border-radius: 2px;
            background: #00E5FF;
            transition: width 0.4s ease, background 0.3s;
        }
        .whistle-progress-fill.complete {
            background: #34C759;
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.6);
        }
        .whistle-fraction {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.05em;
        }
        .whistle-label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @keyframes dot-pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.65); }
        }
        @keyframes pulse-logo {
            0%,100% { transform: scale(1);    opacity: 0.9; }
            50%      { transform: scale(1.06); opacity: 1;   }
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0; }
        }
        @keyframes float-up {
            0%   { transform: translateY(110vh) translateX(0);    opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
        }
        @keyframes pop-in {
            0%   { transform: scale(0.7); opacity: 0; }
            70%  { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }
        .count-pop {
            animation: pop-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
    </style>
</head>
<body>

<!-- OVERLAY LAYOUT -->
<div id="layout-overlay">
    <div id="idle-screen" class="screen active">
        <div class="particles" id="particles"></div>
        <div class="idle-logo">📺</div>
        <div class="idle-title">BLE Display</div>
        <div class="idle-hint">Send a YouTube link via Bluetooth</div>
    </div>
    <!-- gas setup button (shown when UNINSTALLED) -->
    <button id="gas-setup-btn" onclick="onGasSetupClick()">⛽ Install cylinder</button>
    <button id="gas-uninstall-btn" onclick="onGasUninstallClick()" style="display:none">⛽ Remove cylinder</button>

    <!-- gas calibrating label -->
    <div id="gas-calibrating">⏳ Calibrating — do not disturb</div>

    <!-- gas idle widget -->
    <div id="gas-idle-widget">
        <span>⛽</span>
        <span class="gas-pct" id="gas-idle-pct">--%</span>
        <span class="gas-days" id="gas-idle-days"></span>
    </div>

    <div id="youtube-screen" class="screen">
        <div id="player-overlay"></div>
        <!-- gas overlay pill (visible during video) -->
        <div id="gas-overlay-pill">
            <span>⛽</span>
            <span class="gas-pct" id="gas-overlay-pct">--%</span>
        </div>
    </div>

    <div id="clock-screen" class="screen">
        <div class="clock-time">
            <span id="clock-h">00</span><span class="colon">:</span><span id="clock-m">00</span><span class="colon">:</span><span id="clock-s">00</span>
        </div>
        <div class="clock-date" id="clock-date"></div>
        <div class="clock-seconds-bar" id="sec-bar"></div>
    </div>

    <!-- whistle overlay widget (overlay mode only) -->
    <div id="whistle-overlay">
        <div class="whistle-card" id="whistle-card">
            <div class="whistle-top">
                <div class="whistle-dot" id="whistle-dot"></div>
                <div class="whistle-status-text" id="whistle-status">STOPPED</div>
            </div>
            <div class="whistle-number" id="whistle-number">0</div>
            <div class="whistle-label">WHISTLES</div>
            <div class="whistle-divider" id="whistle-divider" style="display:none"></div>
            <div class="whistle-progress-wrap" id="whistle-progress-wrap" style="display:none">
                <div class="whistle-progress-bar">
                    <div class="whistle-progress-fill" id="whistle-progress-fill"></div>
                </div>
                <div class="whistle-fraction" id="whistle-fraction"></div>
            </div>
        </div>
    </div>
</div>

<!-- SPLIT LAYOUT -->
<div id="layout-split">
    <!-- left: existing screens are cloned here via JS into split-screens-left -->
    <div id="split-left">
        <!-- idle/clock screens for split mode -->
        <div id="split-idle-screen" class="screen active">
            <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#0a0a2e 0%,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
                <div class="idle-logo">📺</div>
                <div class="idle-title" style="font-size:1rem;">BLE Display</div>
            </div>
        </div>
        <div id="split-youtube-screen" class="screen">
            <div id="player-split" style="width:100%;height:100%;"></div>
        </div>
        <div id="split-clock-screen" class="screen">
            <div class="clock-time" style="font-size:clamp(2.5rem,8vw,6rem);">
                <span id="split-clock-h">00</span><span class="colon">:</span><span id="split-clock-m">00</span><span class="colon">:</span><span id="split-clock-s">00</span>
            </div>
            <div class="clock-date" id="split-clock-date" style="font-size:clamp(0.6rem,1.5vw,1.1rem);"></div>
            <div class="clock-seconds-bar" id="split-sec-bar"></div>
        </div>
    </div>

    <!-- right: whistle panel -->
    <div id="split-right">
        <div id="whistle-panel">
            <div class="panel-status-row">
                <div class="whistle-dot lg" id="panel-dot"></div>
                <div class="whistle-status-text lg" id="panel-status">STOPPED</div>
            </div>
            <div class="panel-number" id="panel-number">0</div>
            <div class="panel-label">WHISTLES</div>
            <div class="panel-divider" id="panel-divider" style="display:none"></div>
            <div class="panel-progress-wrap" id="panel-progress-wrap" style="display:none">
                <div class="panel-progress-bar">
                    <div class="panel-progress-fill" id="panel-progress-fill"></div>
                </div>
                <div class="panel-fraction" id="panel-fraction"></div>
            </div>
        </div>
        <!-- gas panel (split mode) -->
        <div id="gas-panel">
            <div class="gas-pct-large" id="gas-panel-pct">--%</div>
            <div class="gas-bar-wrap">
                <div class="gas-bar-fill gas-bar-green" id="gas-panel-bar" style="width:0%"></div>
            </div>
            <div class="gas-meta" id="gas-panel-meta">-- days remaining</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/libs/socket.io.min.js"></script>
<script>
'use strict';

(function spawnParticles() {
    const container = document.getElementById('particles');
    if (!container) return;
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left              = Math.random() * 100 + 'vw';
        p.style.animationDuration = (8 + Math.random() * 14) + 's';
        p.style.animationDelay    = (-Math.random() * 20) + 's';
        p.style.opacity           = (0.2 + Math.random() * 0.5).toString();
        container.appendChild(p);
    }
})();

let currentMode    = 'idle';
let previousMode   = 'idle';
let lastVideoId    = null;
let displayMode    = 'overlay';  // 'overlay' | 'split'
let queueActive    = false;
let _lastCount     = -1;
let _lastCountPanel = -1;

try { lastVideoId = localStorage.getItem('lastVideoId'); } catch(e) {}

// ---- screen switching ----

function showScreen(mode) {
    if (displayMode === 'overlay') {
        document.querySelectorAll('#layout-overlay .screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(mode + '-screen');
        if (target) target.classList.add('active');
    } else {
        // split: switch left panel screens
        document.querySelectorAll('#split-left .screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('split-' + mode + '-screen');
        if (target) target.classList.add('active');
    }
    previousMode = currentMode;
    currentMode  = mode;
}

// ---- display mode switch ----

let ytPlayer        = null;
let ytReady         = false;
let pendingVideo    = null;
let ytApiLoaded     = false;
let ytPlayerTarget  = 'overlay';  // which container the player is currently in

function _createPlayer(containerId, onReady) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    const div = document.createElement('div');
    div.id = 'yt-iframe-host';
    div.style.cssText = 'width:100%;height:100%;';
    container.appendChild(div);

    ytPlayer = new YT.Player('yt-iframe-host', {
        width:  '100%',
        height: '100%',
        playerVars: {
            autoplay: 0, controls: 1, rel: 0,
            modestbranding: 1, iv_load_policy: 3, fs: 1,
        },
        events: {
            onReady: function(e) {
                ytReady = true;
                if (onReady) onReady();
            },
            onStateChange: onPlayerStateChange,
        }
    });
}

// Move the iframe to a new container without destroying it
function _movePlayer(targetContainerId) {
    const target = document.getElementById(targetContainerId);
    if (!target) return;
    // find the actual iframe element (YT replaces the div with an iframe)
    const iframeEl = document.getElementById('yt-iframe-host') ||
                     document.querySelector('#' + targetContainerId + ' iframe') ||
                     document.querySelector('iframe[id^="yt-iframe"]');
    if (!iframeEl) return;
    // force full size
    iframeEl.style.width  = '100%';
    iframeEl.style.height = '100%';
    target.innerHTML = '';
    target.appendChild(iframeEl);
}

function switchDisplayMode(newMode) {
    if (newMode === displayMode) return;
    displayMode = newMode;

    const overlayLayout = document.getElementById('layout-overlay');
    const splitLayout   = document.getElementById('layout-split');
    const overlayWidget = document.getElementById('whistle-overlay');

    if (newMode === 'split') {
        overlayLayout.style.display = 'none';
        splitLayout.classList.add('active');
        overlayWidget.style.display = 'none';
        showScreen(currentMode);
        if (ytPlayer && ytReady) {
            _movePlayer('player-split');
        }
    } else {
        splitLayout.classList.remove('active');
        overlayLayout.style.display = '';
        overlayWidget.style.display = '';
        showScreen(currentMode);
        if (ytPlayer && ytReady) {
            _movePlayer('player-overlay');
        }
    }
}

// ---- toast ----

let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ---- clock ----

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
function pad2(n) { return String(n).padStart(2, '0'); }

function tickClock() {
    const now = new Date();
    const h = pad2(now.getHours());
    const m = pad2(now.getMinutes());
    const s = pad2(now.getSeconds());
    const date = `${DAYS[now.getDay()]}  |  ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    const pct  = ((now.getSeconds() / 59) * 100) + '%';

    document.getElementById('clock-h').textContent    = h;
    document.getElementById('clock-m').textContent    = m;
    document.getElementById('clock-s').textContent    = s;
    document.getElementById('clock-date').textContent = date;
    document.getElementById('sec-bar').style.width    = pct;

    // split clock mirrors
    const sh = document.getElementById('split-clock-h');
    if (sh) {
        sh.textContent = h;
        document.getElementById('split-clock-m').textContent    = m;
        document.getElementById('split-clock-s').textContent    = s;
        document.getElementById('split-clock-date').textContent = date;
        document.getElementById('split-sec-bar').style.width    = pct;
    }
}
setInterval(tickClock, 1000);
tickClock();

// ---- whistle overlay (overlay mode) ----

function updateWhistleOverlay(count, active, target) {
    const overlay   = document.getElementById('whistle-overlay');
    const card      = document.getElementById('whistle-card');
    const dot       = document.getElementById('whistle-dot');
    const status    = document.getElementById('whistle-status');
    const numberEl  = document.getElementById('whistle-number');
    const divider   = document.getElementById('whistle-divider');
    const progWrap  = document.getElementById('whistle-progress-wrap');
    const progFill  = document.getElementById('whistle-progress-fill');
    const fraction  = document.getElementById('whistle-fraction');
    const complete  = target > 0 && count >= target;

    if (active || count > 0) {
        overlay.classList.add('visible');
    } else {
        overlay.classList.remove('visible');
        return;
    }

    if (count !== _lastCount && _lastCount !== -1) {
        numberEl.classList.remove('count-pop');
        void numberEl.offsetWidth;
        numberEl.classList.add('count-pop');
    }
    _lastCount = count;
    numberEl.textContent = count;

    if (active) {
        card.classList.add('active');
        dot.classList.add('pulse');
        status.classList.add('active');
        status.textContent = 'COUNTING';
        numberEl.className = complete ? 'whistle-number complete' : 'whistle-number active';
    } else {
        card.classList.remove('active');
        dot.classList.remove('pulse');
        status.classList.remove('active');
        status.textContent = 'STOPPED';
        numberEl.className = 'whistle-number';
    }

    if (target > 0) {
        divider.style.display  = '';
        progWrap.style.display = '';
        const pct = Math.min(count / target, 1.0) * 100;
        progFill.style.width = pct + '%';
        progFill.className   = 'whistle-progress-fill' + (complete ? ' complete' : '');
        fraction.textContent = `${count} / ${target}`;
    } else {
        divider.style.display  = 'none';
        progWrap.style.display = 'none';
    }
}

// ---- whistle panel (split mode) ----

function updateWhistlePanel(count, active, target) {
    const dot      = document.getElementById('panel-dot');
    const status   = document.getElementById('panel-status');
    const numberEl = document.getElementById('panel-number');
    const divider  = document.getElementById('panel-divider');
    const progWrap = document.getElementById('panel-progress-wrap');
    const progFill = document.getElementById('panel-progress-fill');
    const fraction = document.getElementById('panel-fraction');
    const complete = target > 0 && count >= target;

    if (count !== _lastCountPanel && _lastCountPanel !== -1) {
        numberEl.classList.remove('count-pop');
        void numberEl.offsetWidth;
        numberEl.classList.add('count-pop');
    }
    _lastCountPanel = count;
    numberEl.textContent = count;

    if (active) {
        dot.classList.add('pulse');
        status.classList.add('active');
        status.textContent = 'COUNTING';
        numberEl.className = complete ? 'panel-number complete' : 'panel-number active';
    } else {
        dot.classList.remove('pulse');
        status.classList.remove('active');
        status.textContent = 'STOPPED';
        numberEl.className = 'panel-number';
    }

    if (target > 0) {
        divider.style.display  = '';
        progWrap.style.display = '';
        const pct = Math.min(count / target, 1.0) * 100;
        progFill.style.width = pct + '%';
        progFill.className   = 'panel-progress-fill' + (complete ? ' complete' : '');
        fraction.textContent = `${count} / ${target}`;
    } else {
        divider.style.display  = 'none';
        progWrap.style.display = 'none';
    }
}

function updateWhistleAll(count, active, target) {
    updateWhistleOverlay(count, active, target);
    updateWhistlePanel(count, active, target);
}

// ---- YouTube player ----

window.onYouTubeIframeAPIReady = function () {
    // always create in overlay container first (it is always in DOM), then move if in split
    _createPlayer('player-overlay', function() {
        if (displayMode === 'split') {
            _movePlayer('player-split');
        }
        if (pendingVideo) { loadAndPlay(pendingVideo); pendingVideo = null; }
    });
};

function onPlayerStateChange(event) {
    const states = {
        [-1]: 'unstarted',
        [YT.PlayerState.ENDED]:     'ended',
        [YT.PlayerState.PLAYING]:   'playing',
        [YT.PlayerState.PAUSED]:    'paused',
        [YT.PlayerState.BUFFERING]: 'buffering',
        [YT.PlayerState.CUED]:      'cued',
    };
    const state = states[event.data] || 'unknown';
    socket.emit('player_event', { state });
    if (event.data === YT.PlayerState.ENDED && !queueActive) {
        setTimeout(() => { try { ytPlayer.stopVideo(); } catch(e) {} }, 500);
    }
}

function loadAndPlay(videoId) {
    if (!ytPlayer || !ytReady) { pendingVideo = videoId; return; }
    lastVideoId = videoId;
    try { localStorage.setItem('lastVideoId', videoId); } catch(e) {}
    showScreen('youtube');
    ytPlayer.loadVideoById({ videoId, suggestedQuality: 'hd720' });
    setTimeout(() => { try { ytPlayer.playVideo(); } catch(e) {} }, 1500);
}

const qualityMap = {
    '1080p': 'hd1080', '720p': 'hd720', '480p': 'large',
    '360p': 'medium',  '240p': 'small', '144p': 'tiny', 'Auto': 'default'
};

function execCmd(cmd) {
    switch (true) {
        case cmd === 'pause':
            if (ytPlayer) ytPlayer.pauseVideo(); showToast('Paused'); break;
        case cmd === 'resume':
        case cmd === 'play':
            if (ytPlayer) ytPlayer.playVideo(); showToast('Playing'); break;
        case cmd === 'mute':
            if (ytPlayer) ytPlayer.mute(); showToast('Muted'); break;
        case cmd === 'unmute':
            if (ytPlayer) ytPlayer.unMute(); showToast('Unmuted'); break;
        case cmd === 'vol_up':
            if (ytPlayer) ytPlayer.setVolume(Math.min(100, ytPlayer.getVolume() + 10));
            showToast('Vol +'); break;
        case cmd === 'vol_down':
            if (ytPlayer) ytPlayer.setVolume(Math.max(0, ytPlayer.getVolume() - 10));
            showToast('Vol -'); break;
        case cmd === 'seek_fwd':
            if (ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
            showToast('+10s'); break;
        case cmd === 'seek_back':
            if (ytPlayer) ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
            showToast('-10s'); break;
        case cmd === 'replay': {
            const replayId = (ytPlayer && ytPlayer.getVideoData && ytPlayer.getVideoData().video_id)
                || lastVideoId;
            if (replayId) loadAndPlay(replayId);
            showToast('Replay'); break;
        }
        case cmd.startsWith('quality:'): {
            const q  = cmd.split(':')[1];
            const yt = qualityMap[q] || 'default';
            if (ytPlayer) {
                try {
                    const currentTime = ytPlayer.getCurrentTime();
                    const videoId     = ytPlayer.getVideoData().video_id;
                    if (videoId) ytPlayer.loadVideoById({
                        videoId, startSeconds: currentTime, suggestedQuality: yt });
                } catch(e) {}
            }
            showToast(q); break;
        }
        default: break;
    }
}

// ---- socket ----

const socket = io();

socket.on('connect', () => {
    console.log('[Socket] connected');
    if (!ytApiLoaded) {
        ytApiLoaded = true;
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
    }
});

socket.on('disconnect', () => {
    if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e) {} }
    showScreen('idle');
});

socket.on('display_cmd', (data) => {
    const { cmd, video_id, mode } = data;
    if (cmd === 'play' && video_id) {
        showToast('Loading...');
        loadAndPlay(video_id);
        return;
    }
    if (cmd === 'stop') {
        if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e) {} }
        queueActive = false;
        showScreen('idle');
        showToast('Stopped');
        return;
    }
    if (cmd === 'set_mode' && mode) {
        if (mode === currentMode && lastVideoId && ytPlayer) {
            loadAndPlay(lastVideoId);
        } else {
            showScreen(mode);
        }
        return;
    }
    execCmd(cmd);
});

socket.on('queue_status', (data) => {
    queueActive = data.active === true;
});

socket.on('whistle_overlay', (data) => {
    updateWhistleAll(data.count || 0, data.active || false, data.target || 0);
});

function onGasSetupClick() {
    socket.emit('gas_setup', { mode: 'FRESH', brand: null });
    document.getElementById('gas-setup-btn').style.display = 'none';
    console.log('[GAS] setup emitted: FRESH');
}

function onGasUninstallClick() {
    socket.emit('uninstall_cylinder', {});
    document.getElementById('gas-uninstall-btn').style.display = 'none';
    console.log('[GAS] uninstall_cylinder emitted');
}

socket.on('gas_update', (data) => {
    const pct      = data.gas_pct != null ? Math.round(data.gas_pct) : null;
    const days     = data.days_remaining != null ? data.days_remaining.toFixed(1) : null;
    const alert    = data.alert_level || 'green';
    const grams    = data.gas_g != null ? (data.gas_g / 1000).toFixed(2) : null;

    const colorClass = alert === 'red' ? 'gas-red' : alert === 'amber' ? 'gas-amber' : 'gas-green';
    const barClass   = alert === 'red' ? 'gas-bar-red' : alert === 'amber' ? 'gas-bar-amber' : 'gas-bar-green';
    const pctClamped = pct != null ? Math.min(100, Math.max(0, pct)) : null;
    const pctStr     = pctClamped != null ? pctClamped + '%' : '--%';
    const daysStr    = days != null ? days + 'd' : '';
    const metaStr    = days != null ? days + ' days remaining' + (grams ? ' · ' + grams + 'kg' : '') : '--';

    // setup button
    const setupBtn     = document.getElementById('gas-setup-btn');
    const calibratingEl = document.getElementById('gas-calibrating');
    if (setupBtn)      setupBtn.style.display      = (data.cylinder_state === 'UNINSTALLED')      ? 'block' : 'none';
    const uninstallBtn = document.getElementById('gas-uninstall-btn');
    if (uninstallBtn)  uninstallBtn.style.display  = (data.cylinder_state === 'TRACKING' || data.cylinder_state === 'LOW_GAS') ? 'block' : 'none';
    if (calibratingEl) calibratingEl.style.display = (data.cylinder_state === 'BOOTSTRAP_ANCHOR') ? 'block' : 'none';

    // idle widget
    const idlePct  = document.getElementById('gas-idle-pct');
    const idleDays = document.getElementById('gas-idle-days');
    if (data.cylinder_state === 'UNINSTALLED') {
        if (idlePct)  { idlePct.textContent = 'Empty'; idlePct.className = 'gas-pct gas-amber'; }
        if (idleDays) { idleDays.textContent = 'place cylinder'; }
    } else if (data.cylinder_state === 'BOOTSTRAP_ANCHOR') {
        if (idlePct)  { idlePct.textContent = 'Cal...'; idlePct.className = 'gas-pct gas-amber'; }
        if (idleDays) { idleDays.textContent = ''; }
    } else {
        if (idlePct)  { idlePct.textContent  = pctStr; idlePct.className  = 'gas-pct ' + colorClass; }
        if (idleDays) { idleDays.textContent = daysStr; }
    }

    // overlay pill
    const ovPct = document.getElementById('gas-overlay-pct');
    if (ovPct) { ovPct.textContent = pctStr; ovPct.className = 'gas-pct ' + colorClass; }

    // split panel
    const panelPct  = document.getElementById('gas-panel-pct');
    const panelBar  = document.getElementById('gas-panel-bar');
    const panelMeta = document.getElementById('gas-panel-meta');
    if (panelPct)  { panelPct.textContent = pctStr; panelPct.className = 'gas-pct-large ' + colorClass; }
    if (panelBar)  { panelBar.style.width = (pct || 0) + '%'; panelBar.className = 'gas-bar-fill ' + barClass; }
    if (panelMeta) { panelMeta.textContent = metaStr; }
});

socket.on('display_mode', (data) => {
    const mode = data.mode;
    if (mode === 'overlay' || mode === 'split') {
        switchDisplayMode(mode);
    }
});
