<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BLE Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .screen.active { display: flex; }

        #idle-screen {
            background: radial-gradient(ellipse at 30% 40%, #0a0a2e 0%, #000 70%);
            flex-direction: column;
            gap: 24px;
        }
        .idle-logo {
            font-size: 5rem;
            animation: pulse-logo 3s ease-in-out infinite;
        }
        .idle-title {
            font-size: 1.4rem;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }
        .idle-hint {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.15em;
            animation: blink 2.5s ease-in-out infinite;
        }
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: float-up linear infinite;
        }
        #youtube-screen { background: #000; }
        #player { width: 100vw; height: 100vh; }
        #clock-screen {
            background: #000;
            flex-direction: column;
            gap: 12px;
        }
        .clock-time {
            font-size: clamp(4rem, 18vw, 14rem);
            font-weight: 100;
            letter-spacing: -0.02em;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .clock-time .colon {
            animation: blink 1s step-end infinite;
            display: inline-block;
            width: 0.35em;
            text-align: center;
        }
        .clock-date {
            font-size: clamp(1rem, 2.5vw, 2rem);
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .clock-seconds-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255,255,255,0.6);
            transition: width 1s linear;
        }
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            padding: 10px 24px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.05em;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Whistle overlay */
        #whistle-overlay {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
            transform: scale(0.85);
            opacity: 0;
        }
        #whistle-overlay.visible {
            opacity: 1;
            transform: scale(1);
        }
        .whistle-card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px 28px 14px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border: 1.5px solid rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.05),
                        inset 0 1px 0 rgba(255,255,255,0.06);
            min-width: 160px;
        }
        .whistle-card.active {
            border-color: rgba(52, 199, 89, 0.4);
            box-shadow: 0 0 50px rgba(52, 199, 89, 0.12),
                        0 0 100px rgba(52, 199, 89, 0.06),
                        inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .whistle-top {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        .whistle-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a5568;
            flex-shrink: 0;
        }
        .whistle-dot.pulse {
            background: #34C759;
            animation: dot-pulse 1.2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.8);
        }
        .whistle-status-text {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
        }
        .whistle-status-text.active {
            color: rgba(52, 199, 89, 0.7);
        }
        .whistle-number {
            font-size: 7rem;
            font-weight: 100;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            color: #fff;
            text-shadow: none;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .whistle-number.active {
            color: #00E5FF;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.5),
                         0 0 60px rgba(0, 229, 255, 0.2);
        }
        .whistle-number.complete {
            color: #34C759;
            text-shadow: 0 0 30px rgba(52, 199, 89, 0.6),
                         0 0 80px rgba(52, 199, 89, 0.3);
        }
        .whistle-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 2px 0;
        }
        .whistle-progress-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .whistle-progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        .whistle-progress-fill {
            height: 100%;
            border-radius: 2px;
            background: #00E5FF;
            transition: width 0.4s ease, background 0.3s;
        }
        .whistle-progress-fill.complete {
            background: #34C759;
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.6);
        }
        .whistle-fraction {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.05em;
        }
        .whistle-label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @keyframes dot-pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.65); }
        }
        @keyframes pulse-logo {
            0%,100% { transform: scale(1);    opacity: 0.9; }
            50%      { transform: scale(1.06); opacity: 1;   }
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0; }
        }
        @keyframes float-up {
            0%   { transform: translateY(110vh) translateX(0);    opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
        }
        @keyframes pop-in {
            0%   { transform: scale(0.7); opacity: 0; }
            70%  { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }
        .count-pop {
            animation: pop-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
    </style>
</head>
<body>

<div id="idle-screen" class="screen active">
    <div class="particles" id="particles"></div>
    <div class="idle-logo">📺</div>
    <div class="idle-title">BLE Display</div>
    <div class="idle-hint">Send a YouTube link via Bluetooth</div>
</div>

<div id="youtube-screen" class="screen">
    <div id="player"></div>
</div>

<div id="clock-screen" class="screen">
    <div class="clock-time">
        <span id="clock-h">00</span><span class="colon">:</span><span id="clock-m">00</span><span class="colon">:</span><span id="clock-s">00</span>
    </div>
    <div class="clock-date" id="clock-date"></div>
    <div class="clock-seconds-bar" id="sec-bar"></div>
</div>

<!-- Whistle overlay -->
<div id="whistle-overlay">
    <div class="whistle-card" id="whistle-card">
        <div class="whistle-top">
            <div class="whistle-dot" id="whistle-dot"></div>
            <div class="whistle-status-text" id="whistle-status">STOPPED</div>
        </div>
        <div class="whistle-number" id="whistle-number">0</div>
        <div class="whistle-label">WHISTLES</div>
        <div class="whistle-divider" id="whistle-divider" style="display:none"></div>
        <div class="whistle-progress-wrap" id="whistle-progress-wrap" style="display:none">
            <div class="whistle-progress-bar">
                <div class="whistle-progress-fill" id="whistle-progress-fill"></div>
            </div>
            <div class="whistle-fraction" id="whistle-fraction"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/libs/socket.io.min.js"></script>
<script>
'use strict';

(function spawnParticles() {
    const container = document.getElementById('particles');
    if (!container) return;
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left              = Math.random() * 100 + 'vw';
        p.style.animationDuration = (8 + Math.random() * 14) + 's';
        p.style.animationDelay    = (-Math.random() * 20) + 's';
        p.style.opacity           = (0.2 + Math.random() * 0.5).toString();
        container.appendChild(p);
    }
})();

let currentMode  = 'idle';
let previousMode = 'idle';
let lastVideoId  = null;
try { lastVideoId = localStorage.getItem('lastVideoId'); } catch(e) {}
let queueActive  = false;
let _lastCount   = -1;

function showScreen(mode) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(mode + '-screen');
    if (target) target.classList.add('active');
    previousMode = currentMode;
    currentMode  = mode;
}

let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
function pad2(n) { return String(n).padStart(2, '0'); }

function tickClock() {
    const now = new Date();
    document.getElementById('clock-h').textContent    = pad2(now.getHours());
    document.getElementById('clock-m').textContent    = pad2(now.getMinutes());
    document.getElementById('clock-s').textContent    = pad2(now.getSeconds());
    document.getElementById('clock-date').textContent =
        `${DAYS[now.getDay()]}  |  ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    document.getElementById('sec-bar').style.width =
        ((now.getSeconds() / 59) * 100) + '%';
}
setInterval(tickClock, 1000);
tickClock();

function updateWhistleOverlay(count, active, target) {
    const overlay   = document.getElementById('whistle-overlay');
    const card      = document.getElementById('whistle-card');
    const dot       = document.getElementById('whistle-dot');
    const status    = document.getElementById('whistle-status');
    const numberEl  = document.getElementById('whistle-number');
    const divider   = document.getElementById('whistle-divider');
    const progWrap  = document.getElementById('whistle-progress-wrap');
    const progFill  = document.getElementById('whistle-progress-fill');
    const fraction  = document.getElementById('whistle-fraction');
    const complete  = target > 0 && count >= target;

    // show overlay when active or count > 0
    if (active || count > 0) {
        overlay.classList.add('visible');
    } else {
        overlay.classList.remove('visible');
        return;
    }

    // animate count change
    if (count !== _lastCount && _lastCount !== -1) {
        numberEl.classList.remove('count-pop');
        void numberEl.offsetWidth;
        numberEl.classList.add('count-pop');
    }
    _lastCount = count;

    numberEl.textContent = count;

    if (active) {
        card.classList.add('active');
        dot.classList.add('pulse');
        status.classList.add('active');
        status.textContent = 'COUNTING';
        numberEl.className = complete
          ? 'whistle-number complete'
          : 'whistle-number active';
    } else {
        card.classList.remove('active');
        dot.classList.remove('pulse');
        status.classList.remove('active');
        status.textContent = 'STOPPED';
        numberEl.className = 'whistle-number';
    }

    // progress bar
    if (target > 0) {
        divider.style.display  = '';
        progWrap.style.display = '';
        const pct = Math.min(count / target, 1.0) * 100;
        progFill.style.width = pct + '%';
        progFill.className   = 'whistle-progress-fill' + (complete ? ' complete' : '');
        fraction.textContent = `${count} / ${target}`;
    } else {
        divider.style.display  = 'none';
        progWrap.style.display = 'none';
    }
}

let ytPlayer     = null;
let ytReady      = false;
let pendingVideo = null;
let ytApiLoaded  = false;

window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    ytPlayer = new YT.Player('player', {
        width:  '100%',
        height: '100%',
        playerVars: {
            autoplay:       0,
            controls:       1,
            rel:            0,
            modestbranding: 1,
            iv_load_policy: 3,
            fs:             1,
        },
        events: {
            onReady:       onPlayerReady,
            onStateChange: onPlayerStateChange,
        }
    });
};

function onPlayerReady() {
    if (pendingVideo) { loadAndPlay(pendingVideo); pendingVideo = null; }
}

function onPlayerStateChange(event) {
    const states = {
        [-1]: 'unstarted',
        [YT.PlayerState.ENDED]:     'ended',
        [YT.PlayerState.PLAYING]:   'playing',
        [YT.PlayerState.PAUSED]:    'paused',
        [YT.PlayerState.BUFFERING]: 'buffering',
        [YT.PlayerState.CUED]:      'cued',
    };
    const state = states[event.data] || 'unknown';
    socket.emit('player_event', { state });
    if (event.data === YT.PlayerState.ENDED && !queueActive) {
        setTimeout(() => { try { ytPlayer.stopVideo(); } catch(e) {} }, 500);
    }
}

function loadAndPlay(videoId) {
    if (!ytPlayer || !ytReady) { pendingVideo = videoId; return; }
    lastVideoId = videoId;
    try { localStorage.setItem('lastVideoId', videoId); } catch(e) {}
    showScreen('youtube');
    ytPlayer.loadVideoById({ videoId, suggestedQuality: 'hd720' });
    setTimeout(() => { try { ytPlayer.playVideo(); } catch(e) {} }, 1500);
}

const qualityMap = {
    '1080p': 'hd1080', '720p': 'hd720', '480p': 'large',
    '360p': 'medium',  '240p': 'small', '144p': 'tiny', 'Auto': 'default'
};

function execCmd(cmd) {
    switch (true) {
        case cmd === 'pause':
            if (ytPlayer) ytPlayer.pauseVideo(); showToast('Paused'); break;
        case cmd === 'resume':
        case cmd === 'play':
            if (ytPlayer) ytPlayer.playVideo(); showToast('Playing'); break;
        case cmd === 'mute':
            if (ytPlayer) ytPlayer.mute(); showToast('Muted'); break;
        case cmd === 'unmute':
            if (ytPlayer) ytPlayer.unMute(); showToast('Unmuted'); break;
        case cmd === 'vol_up':
            if (ytPlayer) ytPlayer.setVolume(Math.min(100, ytPlayer.getVolume() + 10));
            showToast('Vol +'); break;
        case cmd === 'vol_down':
            if (ytPlayer) ytPlayer.setVolume(Math.max(0, ytPlayer.getVolume() - 10));
            showToast('Vol -'); break;
        case cmd === 'seek_fwd':
            if (ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
            showToast('+10s'); break;
        case cmd === 'seek_back':
            if (ytPlayer) ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
            showToast('-10s'); break;
        case cmd === 'replay': {
            const replayId = (ytPlayer && ytPlayer.getVideoData && ytPlayer.getVideoData().video_id)
                || lastVideoId;
            if (replayId) loadAndPlay(replayId);
            showToast('Replay'); break;
        }
        case cmd.startsWith('quality:'): {
            const q  = cmd.split(':')[1];
            const yt = qualityMap[q] || 'default';
            if (ytPlayer) {
                try {
                    const currentTime = ytPlayer.getCurrentTime();
                    const videoId     = ytPlayer.getVideoData().video_id;
                    if (videoId) ytPlayer.loadVideoById({
                        videoId, startSeconds: currentTime, suggestedQuality: yt });
                } catch(e) {}
            }
            showToast(q); break;
        }
        default: break;
    }
}

const socket = io();

socket.on('connect', () => {
    console.log('[Socket] connected');
    if (!ytApiLoaded) {
        ytApiLoaded = true;
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
    }
});

socket.on('disconnect', () => {
    if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e) {} }
    showScreen('idle');
});

socket.on('display_cmd', (data) => {
    const { cmd, video_id, mode } = data;
    if (cmd === 'play' && video_id) {
        showToast('Loading...');
        loadAndPlay(video_id);
        return;
    }
    if (cmd === 'stop') {
        if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e) {} }
        queueActive = false;
        showScreen('idle');
        showToast('Stopped');
        return;
    }
    if (cmd === 'set_mode' && mode) {
        if (mode === currentMode && lastVideoId && ytPlayer) {
            loadAndPlay(lastVideoId);
        } else {
            showScreen(mode);
        }
        return;
    }
    execCmd(cmd);
});

socket.on('queue_status', (data) => {
    queueActive = data.active === true;
});

socket.on('whistle_overlay', (data) => {
    updateWhistleOverlay(data.count || 0, data.active || false, data.target || 0);
});
</script>
</body>
</html>
