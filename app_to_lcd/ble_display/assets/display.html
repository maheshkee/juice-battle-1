<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BLE Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .screen.active { display: flex; }

        #idle-screen {
            background: radial-gradient(ellipse at 30% 40%, #0a0a2e 0%, #000 70%);
            flex-direction: column;
            gap: 24px;
        }
        .idle-logo {
            font-size: 5rem;
            animation: pulse-logo 3s ease-in-out infinite;
        }
        .idle-title {
            font-size: 1.4rem;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }
        .idle-hint {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.15em;
            animation: blink 2.5s ease-in-out infinite;
        }
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: float-up linear infinite;
        }
        #youtube-screen { background: #000; }
        #player { width: 100vw; height: 100vh; }
        #clock-screen {
            background: #000;
            flex-direction: column;
            gap: 12px;
        }
        .clock-time {
            font-size: clamp(4rem, 18vw, 14rem);
            font-weight: 100;
            letter-spacing: -0.02em;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .clock-time .colon {
            animation: blink 1s step-end infinite;
            display: inline-block;
            width: 0.35em;
            text-align: center;
        }
        .clock-date {
            font-size: clamp(1rem, 2.5vw, 2rem);
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .clock-seconds-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255,255,255,0.6);
            transition: width 1s linear;
        }
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            padding: 10px 24px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.05em;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Whistle overlay */
        #whistle-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #whistle-overlay.hidden { opacity: 0; }
        .whistle-badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .whistle-badge.active {
            border-color: rgba(52, 199, 89, 0.5);
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.15);
        }
        .whistle-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a5568;
            flex-shrink: 0;
        }
        .whistle-dot.pulse {
            background: #34C759;
            animation: dot-pulse 1.5s ease-in-out infinite;
        }
        .whistle-count {
            font-size: 1.4rem;
            font-weight: 100;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .whistle-label {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @keyframes dot-pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.7); }
        }
        @keyframes pulse-logo {
            0%,100% { transform: scale(1);    opacity: 0.9; }
            50%      { transform: scale(1.06); opacity: 1;   }
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0; }
        }
        @keyframes float-up {
            0%   { transform: translateY(110vh) translateX(0);    opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="idle-screen" class="screen active">
    <div class="particles" id="particles"></div>
    <div class="idle-logo">📺</div>
    <div class="idle-title">BLE Display</div>
    <div class="idle-hint">Send a YouTube link via Bluetooth</div>
</div>

<div id="youtube-screen" class="screen">
    <div id="player"></div>
</div>

<div id="clock-screen" class="screen">
    <div class="clock-time">
        <span id="clock-h">00</span><span class="colon">:</span><span id="clock-m">00</span><span class="colon">:</span><span id="clock-s">00</span>
    </div>
    <div class="clock-date" id="clock-date"></div>
    <div class="clock-seconds-bar" id="sec-bar"></div>
</div>

<!-- Whistle overlay - always visible top-right -->
<div id="whistle-overlay" class="hidden">
    <div class="whistle-badge" id="whistle-badge">
        <div class="whistle-dot" id="whistle-dot"></div>
        <div>
            <div class="whistle-count" id="whistle-count">0</div>
            <div class="whistle-label">whistles</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/libs/socket.io.min.js"></script>
<script>
'use strict';

(function spawnParticles() {
    const container = document.getElementById('particles');
    if (!container) return;
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left              = Math.random() * 100 + 'vw';
        p.style.animationDuration = (8 + Math.random() * 14) + 's';
        p.style.animationDelay    = (-Math.random() * 20) + 's';
        p.style.opacity           = (0.2 + Math.random() * 0.5).toString();
        container.appendChild(p);
    }
})();

let currentMode  = 'idle';
let previousMode = 'idle';
let lastVideoId  = null;
try { lastVideoId = localStorage.getItem('lastVideoId'); } catch(e) {}
let queueActive  = false;

function showScreen(mode) {
    if (mode === 'idle') console.log('[DEBUG] showScreen idle called from:', new Error().stack);
    document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
    });
    const target = document.getElementById(mode + '-screen');
    if (target) target.classList.add('active');
    previousMode = currentMode;
    currentMode  = mode;
}

let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function pad2(n) { return String(n).padStart(2, '0'); }

function tickClock() {
    const now = new Date();
    document.getElementById('clock-h').textContent    = pad2(now.getHours());
    document.getElementById('clock-m').textContent    = pad2(now.getMinutes());
    document.getElementById('clock-s').textContent    = pad2(now.getSeconds());
    document.getElementById('clock-date').textContent =
        `${DAYS[now.getDay()]}  |  ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    document.getElementById('sec-bar').style.width =
        ((now.getSeconds() / 59) * 100) + '%';
}
setInterval(tickClock, 1000);
tickClock();

function updateWhistleOverlay(count, active) {
    const overlay = document.getElementById('whistle-overlay');
    const badge   = document.getElementById('whistle-badge');
    const dot     = document.getElementById('whistle-dot');
    const countEl = document.getElementById('whistle-count');

    countEl.textContent = count;

    if (active) {
        overlay.classList.remove('hidden');
        badge.classList.add('active');
        dot.classList.add('pulse');
    } else {
        // show overlay only if count > 0 when inactive
        if (count > 0) {
            overlay.classList.remove('hidden');
        } else {
            overlay.classList.add('hidden');
        }
        badge.classList.remove('active');
        dot.classList.remove('pulse');
    }
}

let ytPlayer     = null;
let ytReady      = false;
let pendingVideo = null;
let ytApiLoaded  = false;

window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    ytPlayer = new YT.Player('player', {
        width:  '100%',
        height: '100%',
        playerVars: {
            autoplay:       0,
            controls:       1,
            rel:            0,
            modestbranding: 1,
            iv_load_policy: 3,
            fs:             1,
        },
        events: {
            onReady:       onPlayerReady,
            onStateChange: onPlayerStateChange,
        }
    });
};

function onPlayerReady() {
    if (pendingVideo) {
        loadAndPlay(pendingVideo);
        pendingVideo = null;
    }
}

function onPlayerStateChange(event) {
    const states = {
        [-1]: 'unstarted',
        [YT.PlayerState.ENDED]:     'ended',
        [YT.PlayerState.PLAYING]:   'playing',
        [YT.PlayerState.PAUSED]:    'paused',
        [YT.PlayerState.BUFFERING]: 'buffering',
        [YT.PlayerState.CUED]:      'cued',
    };
    const state = states[event.data] || 'unknown';
    socket.emit('player_event', { state });
    if (event.data === YT.PlayerState.ENDED && !queueActive) {
        setTimeout(() => { try { ytPlayer.stopVideo(); } catch(e) {} }, 500);
    }
}

function loadAndPlay(videoId) {
    if (!ytPlayer || !ytReady) {
        pendingVideo = videoId;
        return;
    }
    lastVideoId = videoId;
    try { localStorage.setItem('lastVideoId', videoId); } catch(e) {}
    showScreen('youtube');
    ytPlayer.loadVideoById({ videoId, suggestedQuality: 'hd720' });
    setTimeout(() => {
        try { ytPlayer.playVideo(); } catch(e) {}
    }, 1500);
}

const qualityMap = {
    '1080p': 'hd1080', '720p': 'hd720', '480p': 'large',
    '360p': 'medium',  '240p': 'small', '144p': 'tiny', 'Auto': 'default'
};

function execCmd(cmd) {
    switch (true) {
        case cmd === 'pause':
            if (ytPlayer) ytPlayer.pauseVideo();
            showToast('Paused');
            break;
        case cmd === 'resume':
        case cmd === 'play':
            if (ytPlayer) ytPlayer.playVideo();
            showToast('Playing');
            break;
        case cmd === 'mute':
            if (ytPlayer) ytPlayer.mute();
            showToast('Muted');
            break;
        case cmd === 'unmute':
            if (ytPlayer) ytPlayer.unMute();
            showToast('Unmuted');
            break;
        case cmd === 'vol_up':
            if (ytPlayer) ytPlayer.setVolume(Math.min(100, ytPlayer.getVolume() + 10));
            showToast('Vol +');
            break;
        case cmd === 'vol_down':
            if (ytPlayer) ytPlayer.setVolume(Math.max(0, ytPlayer.getVolume() - 10));
            showToast('Vol -');
            break;
        case cmd === 'seek_fwd':
            if (ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
            showToast('+10s');
            break;
        case cmd === 'seek_back':
            if (ytPlayer) ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
            showToast('-10s');
            break;
        case cmd === 'replay': {
            const replayId = (ytPlayer && ytPlayer.getVideoData && ytPlayer.getVideoData().video_id)
                || lastVideoId;
            if (replayId) {
                loadAndPlay(replayId);
            }
            showToast('Replay');
            break;
        }
        case cmd.startsWith('quality:'): {
            const q = cmd.split(':')[1];
            const yt = qualityMap[q] || 'default';
            if (ytPlayer) {
                try {
                    const currentTime = ytPlayer.getCurrentTime();
                    const videoId = ytPlayer.getVideoData().video_id;
                    if (videoId) {
                        ytPlayer.loadVideoById({
                            videoId,
                            startSeconds: currentTime,
                            suggestedQuality: yt
                        });
                    }
                } catch(e) {}
            }
            showToast(q);
            break;
        }
        default:
            break;
    }
}

const socket = io();

socket.on('connect', () => {
    console.log('[Socket] connected');
    if (!ytApiLoaded) {
        ytApiLoaded = true;
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
    }
});

socket.on('disconnect', () => {
    console.log('[DEBUG] socket disconnected - going idle');
    if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e) {} }
    showScreen('idle');
});

socket.on('display_cmd', (data) => {
    console.log('[DEBUG] display_cmd received:', JSON.stringify(data));
    const { cmd, video_id, mode } = data;
    if (cmd === 'play' && video_id) {
        showToast('Loading...');
        loadAndPlay(video_id);
        return;
    }
    if (cmd === 'stop') {
        if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e) {} }
        queueActive = false;
        showScreen('idle');
        showToast('Stopped');
        return;
    }
    if (cmd === 'set_mode' && mode) {
        if (mode === currentMode && lastVideoId && ytPlayer) {
            loadAndPlay(lastVideoId);
        } else {
            showScreen(mode);
        }
        return;
    }
    execCmd(cmd);
});

socket.on('queue_status', (data) => {
    queueActive = data.active === true;
});

socket.on('whistle_overlay', (data) => {
    updateWhistleOverlay(data.count || 0, data.active || false);
});
</script>
</body>
</html>
